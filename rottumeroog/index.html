document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]');
  if (!b) return;
  state.ui.tab = b.getAttribute('data-tab');
  window.scrollTo(0, 0);
  save(); render();
});

document.addEventListener('change', function (e) {
  var t = e.target;

  if (!magWijzigen() &&
      t.matches('[data-act="fase-item"], [data-act="onb-item"], [data-pb], [data-mwnotitie], [data-mw]')) {
    if (t.type === 'checkbox') t.checked = !t.checked;   /* zet het vinkje terug */
    vraagCode(); return;
  }
  if (t.matches('[data-act="fase-item"]')) {
    var id = t.getAttribute('data-id');
    state.fases.forEach(function (f) {
      f.items.forEach(function (i) {
        if (i.id === id) {
          i.done = t.checked;
          log(t.checked ? 'Checklistpunt afgevinkt' : 'Vinkje weggehaald', 'Route — fase ' + f.n, i.t);
        }
      });
    });
    save(); render(); return;
  }
  if (t.matches('[data-act="onb-item"]')) {
    var oid = t.getAttribute('data-id');
    state.onboarding.forEach(function (c) { c.items.forEach(function (i) { if (i.id === oid) i.done = t.checked; }); });
    save(); render(); return;
  }
  if (t.matches('[data-pres]')) {
    state.ui.presOpties = state.ui.presOpties || standaardOpties();
    state.ui.presOpties[t.getAttribute('data-pres')] = t.checked;
    save(); return;
  }
  if (t.matches('[data-pb]')) {
    var pbv = t.getAttribute('data-pb');
    var kaartje = pbKaart(state.ui.pbClient);
    if (kaartje.velden[pbv] !== t.value) {
      kaartje.velden[pbv] = t.value;
      log('PB-overleg ingevuld', 'PB-overleg', 'cliënt ' + state.ui.pbClient + ' — ' + pbv);
      save();
    }
    return;
  }
  if (t.matches('[data-mwnotitie]')) {
    var mwn = state.medewerkers.filter(function (x) { return x.id === t.getAttribute('data-mwnotitie'); })[0];
    if (mwn) { mwn.notitie = t.value; save(); }
    return;
  }
  if (t.matches('[data-mw]')) {
    var mws = state.medewerkers.filter(function (x) { return x.id === t.getAttribute('data-mw'); })[0];
    if (mws) {
      var vk = t.getAttribute('data-v');
      var naamVanVaardigheid = vk;
      VAARDIGHEDEN.forEach(function (cat) {
        cat[2].forEach(function (v) { if (v[0] === vk) naamVanVaardigheid = v[1]; });
      });
      var statusNaam = '';
      BEKWAAM_STATUS.forEach(function (bs) { if (bs[0] === t.value) statusNaam = bs[1]; });
      if (t.value) mws.scores[vk] = t.value; else delete mws.scores[vk];
      log('Bekwaamheid bijgewerkt', 'Bekwaamheid', mws.naam + ' — ' + naamVanVaardigheid + ': ' + (statusNaam || 'niet bepaald'));
      save(); render();
    }
    return;
  }
  if (t.matches('[data-filter]')) {
    var f = t.getAttribute('data-filter');
    state.ui.filter[f] = t.value;
    state.ui.filter.special = '';
    save(); render();
    var el = document.querySelector('[data-filter="' + f + '"]');
    if (el && f !== 'q') el.focus();
  }
});

document.addEventListener('input', function (e) {
  if (e.target.matches('[data-zoek="begeleiden"]')) {
    state.ui.begeleidenQ = e.target.value;
    save();
    var p = e.target.selectionStart;
    render();
    var z = document.querySelector('[data-zoek="begeleiden"]');
    if (z) { z.focus(); try { z.setSelectionRange(p, p); } catch (err) { /* search-veld ondersteunt geen selectie */ } }
    return;
  }
  if (e.target.matches('[data-filter="q"]')) {
    state.ui.filter.q = e.target.value;
    state.ui.filter.special = '';
    save();
    var pos = e.target.selectionStart;
    render();
    var el = document.querySelector('[data-filter="q"]');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* type ondersteunt geen selectie */ } }
  }
});

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  var id = b.getAttribute('data-id');

  /* Kijken mag altijd; wijzigen alleen met de teamcode. */
  if (!VRIJ[act] && !magWijzigen()) { vraagCode(); return; }

  if (act === 'overlay' && e.target === b) { sluitModal(); return; }
  if (act === 'modal-sluit') { sluitModal(); return; }
  if (act === 'modal-opslaan') { document.getElementById('modalhost')._save(); return; }

  if (act === 'ga-route') { state.ui.tab = 'Route'; state.ui.openFase = state.fase; save(); render(); window.scrollTo(0, 0); return; }
  if (act === 'ga-tab') { state.ui.tab = b.getAttribute('data-tab'); save(); render(); window.scrollTo(0, 0); return; }

  if (act === 'zoek-top-wis') {
    state.ui.zoek = '';
    var zt = document.getElementById('zoektop'); if (zt) zt.value = '';
    save(); render(); return;
  }
  if (act === 'zoek-ga') {
    var extra = {};
    try { extra = JSON.parse(b.getAttribute('data-extra') || '{}'); } catch (e) { extra = {}; }
    state.ui.tab = b.getAttribute('data-tab');
    state.ui.zoek = '';
    var zt2 = document.getElementById('zoektop'); if (zt2) zt2.value = '';
    if (extra.begeleidenQ) state.ui.begeleidenQ = extra.begeleidenQ; else state.ui.begeleidenQ = '';
    if (extra.situatie) state.ui.openSituatie = extra.situatie;
    if (extra.openFase) state.ui.openFase = extra.openFase;
    if (extra.pbClient) state.ui.pbClient = extra.pbClient;
    if (extra.q) { state.ui.filter = { eigenaar: '', status: '', prioriteit: '', fase: '', kant: '', categorie: '', q: extra.q, special: '' }; }
    save(); render(); window.scrollTo(0, 0); return;
  }

  if (act === 'presenteer-menu') {
    var host = document.getElementById('modalhost');
    var opt = state.ui.presOpties || standaardOpties();
    host.innerHTML = '<div class="overlay" data-act="overlay"><div class="modal">' +
      '<header><h3>Presenteren</h3><button class="btn sm ghost" data-act="modal-sluit" style="margin-left:auto">Sluiten</button></header>' +
      '<div class="body">' +
      '<p class="uitleg">Voor een teamoverleg op een groot scherm. De presentatiemodus toont dezelfde informatie als de PowerPoint — ' +
      'alleen zonder bewerkknoppen, en altijd actueel.</p>' +
      '<div class="veld"><label>Wat neem je mee?</label><div class="opt-lijst">' +
      PRES_OPTIES.map(function (p) {
        return '<label class="opt"><input type="checkbox" data-pres="' + p[0] + '"' + (opt[p[0]] ? ' checked' : '') + '><span>' + esc(p[1]) + '</span></label>';
      }).join('') + '</div>' +
      '<div class="hint">De titel, “waarom doen we dit” en “wat verwachten we van elkaar” zitten er altijd in.</div></div>' +
      '<button class="btn sm" data-act="pres-preset">Alleen wat voor het teamoverleg nodig is</button>' +
      '</div>' +
      '<footer>' +
      '<button class="btn" data-act="dia-pptx">PowerPoint maken</button>' +
      '<button class="btn primary" data-act="presenteer-start">Presentatiemodus</button>' +
      '</footer></div></div>';
    return;
  }
  if (act === 'pres-preset') {
    state.ui.presOpties = overlegOpties();
    save();
    Array.prototype.forEach.call(document.querySelectorAll('[data-pres]'), function (c) {
      c.checked = !!state.ui.presOpties[c.getAttribute('data-pres')];
    });
    toast('Alleen de overlegonderdelen aangevinkt.');
    return;
  }
  if (act === 'presenteer-start') {
    state.ui.presenteer = true; state.ui.dia = 0; state.ui.zoek = '';
    sluitModal(); save(); render(); window.scrollTo(0, 0);
    log('Presentatiemodus gestart', 'Presentatie', '');
    return;
  }
  if (act === 'presenteer-stop') {
    state.ui.presenteer = false;
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () { /* mag mislukken */ });
    save(); render(); return;
  }
  if (act === 'dia-vorige') { state.ui.dia = Math.max(0, (state.ui.dia || 0) - 1); save(); render(); return; }
  if (act === 'dia-volgende') { state.ui.dia = (state.ui.dia || 0) + 1; save(); render(); return; }
  if (act === 'dia-scherm') {
    var el = document.documentElement;
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () { toast('Volledig scherm kan hier niet.'); });
    else toast('Volledig scherm kan hier niet.');
    return;
  }
  if (act === 'dia-pptx') {
    sluitModal();
    maakPowerpoint(state.ui.presOpties || standaardOpties());
    return;
  }

  if (act === 'ik-ben') {
    var namen = state.medewerkers.map(function (m) { return m.naam; });
    NAMEN.forEach(function (n) { if (namen.indexOf(n) === -1) namen.push(n); });
    openModal('Wie ben jij?', [
      { k: 'ikBen', l: 'Kies je naam', t: 'select', opts: [''].concat(namen), optioneel: true,
        hint: 'Zo staat bij elke wijziging wie hem heeft gemaakt. Dit blijft op dit apparaat staan.' },
      { k: 'anders', l: 'Staat je naam er niet bij? Vul hem hier in', t: 'text', vol: true }
    ], { ikBen: state.ikBen }, function (d) {
      state.ikBen = d.anders || d.ikBen;
      save(); render(); toast(state.ikBen ? 'Hallo ' + state.ikBen + '.' : 'Naam gewist.');
    });
    return;
  }
  if (act === 'log-toggle') { state.ui.logOpen = !state.ui.logOpen; save(); render(); return; }
  if (act === 'log-wis') {
    if (window.confirm('De hele wijzigingsgeschiedenis wissen? Dit kan niet ongedaan gemaakt worden.')) {
      state.log = []; save(); render(); toast('Geschiedenis gewist.');
    }
    return;
  }

  if (act === 'verbeter-nieuw') {
    openModal('Ik zie iets dat beter kan', [
      { k: 'wat', l: 'Wat loop je tegenaan?', t: 'textarea', vol: true, hint: 'Het mag klein zijn. Eén zin is genoeg.' },
      { k: 'waarom', l: 'Waarom is dit lastig?', t: 'textarea', vol: true },
      { k: 'helpt', l: 'Wat zou volgens jou helpen? (mag je openlaten)', t: 'textarea', vol: true },
      { k: 'soort', l: 'Waar gaat het over?', t: 'select', opts: VERBETER_SOORTEN },
      { k: 'locatie', l: 'Waar? (ruimte, map, systeem)', t: 'text' },
      { k: 'door', l: 'Gemeld door', t: 'select', opts: [''].concat(NAMEN) }
    ], { soort: VERBETER_SOORTEN[0], door: state.ikBen }, function (d) {
      d.id = uid('vb'); d.status = 'Nieuw'; d.datum = new Date().toISOString().slice(0, 10);
      d.eigenaar = ''; d.terugkoppeling = '';
      state.verbeterpunten.unshift(d);
      state.ui.tab = 'Dit kan beter'; state.ui.zoek = '';
      var z = document.getElementById('zoektop'); if (z) z.value = '';
      log('Verbeterpunt gemeld', 'Dit kan beter', d.wat); save(); render(); window.scrollTo(0, 0); toast('Bedankt — het staat erin.');
    });
    return;
  }
  if (act === 'verbeter-edit') {
    var vb = state.verbeterpunten.filter(function (x) { return x.id === id; })[0];
    if (!vb) return;
    openModal('Verbeterpunt beoordelen', [
      { k: 'wat', l: 'Wat loop je tegenaan?', t: 'textarea', vol: true },
      { k: 'soort', l: 'Soort', t: 'select', opts: VERBETER_SOORTEN },
      { k: 'status', l: 'Status', t: 'select', opts: VERBETER_STATUS },
      { k: 'eigenaar', l: 'Wie pakt het op?', t: 'select', opts: [''].concat(NAMEN) },
      { k: 'helpt', l: 'Wat zou helpen?', t: 'textarea', vol: true },
      { k: 'terugkoppeling', l: 'Terugkoppeling aan de melder', t: 'textarea', vol: true,
        hint: 'Ook als het antwoord “nu niet” is — dan weet de melder tenminste dat ernaar gekeken is.' }
    ], vb, function (d) {
      Object.keys(d).forEach(function (k) { vb[k] = d[k]; });
      save(); render(); toast('Bijgewerkt.');
    });
    return;
  }
  if (act === 'verbeter-actie') {
    var vp = state.verbeterpunten.filter(function (x) { return x.id === id; })[0];
    if (!vp) return;
    verversClientOpties();
    openModal('Actie maken van dit verbeterpunt', ACTIE_VELDEN, {
      titel: vp.wat, uitleg: vp.waarom, notitie: vp.helpt, eigenaar: vp.eigenaar,
      status: 'Nog te doen', prioriteit: 'midden', fase: state.fase, kant: 'Team', categorie: 'Werkproces', controle: 'Nee'
    }, function (d) {
      d.id = uid('a'); d.aangemaakt = new Date().toISOString().slice(0, 10); d.gewijzigd = d.aangemaakt;
      d.fase = Number(d.fase);
      ['backup', 'voltooidDoor', 'voltooidOp', 'controleDoor', 'controleOp', 'afrondnotitie']
        .forEach(function (k) { if (d[k] == null) d[k] = ''; });
      state.acties.unshift(d);
      vp.status = 'Actie uitgezet'; if (d.eigenaar) vp.eigenaar = d.eigenaar;
      log('Verbeterpunt omgezet in actie', 'Dit kan beter', d.titel); save(); render(); toast('Actie aangemaakt op het actieboard.');
    });
    return;
  }
  if (act === 'verbeter-weg') {
    if (window.confirm('Dit verbeterpunt verwijderen?')) {
      state.verbeterpunten = state.verbeterpunten.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'proc-edit') {
    openModal('Links en nummers', [
      { k: 'medischNummer', l: 'Medische dienst — nummer of route', t: 'text', vol: true, hint: 'Vul in wat er bij jullie geldt. Dit dashboard verzint geen nummers.' },
      { k: 'medischToelichting', l: 'Toelichting medische route', t: 'textarea', vol: true },
      { k: 'vmsLink', l: 'Officiële VMS-werkinstructie — waar staat die?', t: 'text', vol: true },
      { k: 'defectRoute', l: 'Defectmelding — officiële route of systeem', t: 'text', vol: true }
    ], state.procedures, function (d) {
      Object.keys(d).forEach(function (k) { state.procedures[k] = d[k]; });
      save(); render(); toast('Bijgewerkt.');
    });
    return;
  }
  if (act === 'vms-edit') {
    var v = state.vms.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    openModal('VMS bij cliënt ' + v.client, [
      { k: 'wanneer', l: 'Wanneer maken we bij deze cliënt een melding?', t: 'textarea', vol: true },
      { k: 'plan', l: 'Signaleringsplan', t: 'select', opts: DOCSTATUS },
      { k: 'bijzonder', l: 'Bijzonderheden', t: 'textarea', vol: true }
    ], v, function (d) {
      Object.keys(d).forEach(function (k) { v[k] = d[k]; }); log('VMS-afspraak gewijzigd', 'Procedures', 'cliënt ' + v.client); save(); render();
    });
    return;
  }
  if (act === 'defect-nieuw') {
    openModal('Defect melden', DEFECT_VELDEN, { gevaar: 'Nee', status: 'Gemeld', door: state.ikBen, datum: new Date().toISOString().slice(0, 10) }, function (d) {
      d.id = uid('d'); state.defecten.unshift(d); log('Defect gemeld', 'Procedures', d.wat + (d.locatie ? ' - ' + d.locatie : '')); save(); render(); toast('Melding toegevoegd.');
    });
    return;
  }
  if (act === 'defect-edit') {
    var df = state.defecten.filter(function (x) { return x.id === id; })[0];
    if (!df) return;
    openModal('Melding bewerken', DEFECT_VELDEN, df, function (d) {
      Object.keys(d).forEach(function (k) { df[k] = d[k]; }); log('Defectmelding bijgewerkt', 'Procedures', df.wat + ' - ' + df.status); save(); render();
    });
    return;
  }
  if (act === 'defect-weg') {
    if (window.confirm('Deze melding verwijderen?')) {
      state.defecten = state.defecten.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'zoek-snel') { state.ui.begeleidenQ = b.getAttribute('data-q'); state.ui.tab = 'Begeleiden'; save(); render(); window.scrollTo(0, 0); return; }
  if (act === 'zoek-wis') { state.ui.begeleidenQ = ''; save(); render(); return; }
  if (act === 'situatie') {
    state.ui.openSituatie = state.ui.openSituatie === id ? '' : id;
    save(); render(); return;
  }

  if (act === 'pb-client') { state.ui.pbClient = b.getAttribute('data-naam'); save(); render(); window.scrollTo(0, 0); return; }
  if (act === 'pb-hoe') {
    pbKaart(state.ui.pbClient).hoe = b.getAttribute('data-w'); save(); render(); return;
  }
  if (act === 'pb-actie') {
    var naam = b.getAttribute('data-naam');
    verversClientOpties();
    openModal('Actie uit het PB-overleg', ACTIE_VELDEN,
      { status: 'Nog te doen', prioriteit: 'midden', fase: state.fase, kant: 'Team', categorie: 'Cliënt', client: naam, controle: 'Ja' },
      function (d) {
        d.id = uid('a'); d.aangemaakt = new Date().toISOString().slice(0, 10); d.gewijzigd = d.aangemaakt;
        d.fase = Number(d.fase);
        ['uitleg', 'backup', 'voltooidDoor', 'voltooidOp', 'controleDoor', 'controleOp', 'afrondnotitie']
          .forEach(function (k) { if (d[k] == null) d[k] = ''; });
        state.acties.unshift(d); log('Actie uit PB-overleg', 'PB-overleg', naam + ': ' + d.titel); save(); render(); toast('Actie toegevoegd aan het actieboard.');
      });
    return;
  }

  if (act === 'mw-open') { state.ui.openMedewerker = state.ui.openMedewerker === id ? '' : id; save(); render(); return; }
  if (act === 'mw-nieuw') {
    openModal('Medewerker toevoegen', [
      { k: 'naam', l: 'Naam', t: 'text', vol: true },
      { k: 'functie', l: 'Functie', t: 'select', opts: ['Begeleider C', "Begeleider D / PB'er", 'Begeleider E', 'Coach', 'Hoofdcoach', 'Leerling'] }
    ], { functie: 'Begeleider C' }, function (d) {
      state.medewerkers.push({ id: uid('m'), naam: d.naam, functie: d.functie, scores: {}, notitie: '' });
      log('Medewerker toegevoegd', 'Bekwaamheid', d.naam); save(); render(); toast('Medewerker toegevoegd.');
    });
    return;
  }
  if (act === 'mw-weg') {
    var mw = state.medewerkers.filter(function (x) { return x.id === id; })[0];
    if (mw && window.confirm(mw.naam + ' uit deze lijst verwijderen?')) {
      state.medewerkers = state.medewerkers.filter(function (x) { return x.id !== id; });
      state.ui.openMedewerker = '';
      save(); render();
    }
    return;
  }
  if (act === 'set-fase') { state.fase = Number(b.getAttribute('data-n')); log('Huidige fase gewijzigd', 'Route', 'fase ' + state.fase); save(); render(); toast('Fase ' + state.fase + ' is nu de huidige fase.'); return; }
  if (act === 'fase-toggle') {
    var fn = Number(b.getAttribute('data-n'));
    state.ui.openFase = state.ui.openFase === fn ? 0 : fn;
    save(); render(); return;
  }

  if (act === 'focus-edit') {
    openModal('Onze focus op dit moment', [{ k: 'punten', l: 'Maximaal 5 punten — één per regel', t: 'textarea', vol: true }],
      { punten: state.focusPunten.join('\n') }, function (d) {
        state.focusPunten = regelsNaarLijst(d.punten).slice(0, 5);
        log('Focus aangepast', 'Overzicht', state.focusPunten.join(' / ')); save(); render(); toast('Focus bijgewerkt.');
      });
    return;
  }
  if (act === 'week-edit') {
    openModal('Wat verwachten we deze week?', [{ k: 'punten', l: '3 tot 5 concrete teamprioriteiten — één per regel', t: 'textarea', vol: true }],
      { punten: state.weekPunten.join('\n') }, function (d) {
        state.weekPunten = regelsNaarLijst(d.punten).slice(0, 5);
        log('Weekprioriteiten aangepast', 'Overzicht', state.weekPunten.join(' / ')); save(); render(); toast('Weekprioriteiten bijgewerkt.');
      });
    return;
  }

  if (act === 'check-nieuw') {
    var fnr = Number(b.getAttribute('data-n'));
    openModal('Checklistpunt toevoegen aan fase ' + fnr, CHECK_VELDEN, {}, function (d) {
      var fs = state.fases.filter(function (x) { return x.n === fnr; })[0];
      fs.items.push({ id: uid('f'), t: d.t, wie: d.wie, done: false });
      log('Checklistpunt toegevoegd', 'Route - fase ' + fnr, d.t); save(); render(); toast('Punt toegevoegd.');
    });
    return;
  }
  if (act === 'check-edit') {
    var item = null;
    state.fases.forEach(function (f) { f.items.forEach(function (i) { if (i.id === id) item = i; }); });
    if (!item) return;
    openModal('Checklistpunt bewerken', CHECK_VELDEN, item, function (d) {
      item.t = d.t; item.wie = d.wie; log('Checklistpunt gewijzigd', 'Route', item.t + (item.wie ? ' - ' + item.wie : '')); save(); render();
    });
    return;
  }
  if (act === 'check-weg') {
    if (window.confirm('Dit checklistpunt verwijderen?')) {
      state.fases.forEach(function (f) { f.items = f.items.filter(function (i) { return i.id !== id; }); });
      save(); render();
    }
    return;
  }

  if (act === 'afspraak-nieuw') {
    openModal('Vaste afspraak toevoegen', AFSPRAAK_VELDEN, { functie: 'Iedereen', ritme: 'Elke dienst' }, function (d) {
      d.id = uid('v'); state.afspraken.push(d); log('Vaste afspraak toegevoegd', 'Vaste afspraken', d.functie + ': ' + d.tekst); save(); render(); toast('Afspraak toegevoegd.');
    });
    return;
  }
  if (act === 'afspraak-edit') {
    var af = state.afspraken.filter(function (x) { return x.id === id; })[0];
    if (!af) return;
    openModal('Vaste afspraak bewerken', AFSPRAAK_VELDEN, af, function (d) {
      Object.keys(d).forEach(function (k) { af[k] = d[k]; }); log('Vaste afspraak gewijzigd', 'Vaste afspraken', af.tekst); save(); render();
    });
    return;
  }
  if (act === 'afspraak-weg') {
    if (window.confirm('Deze vaste afspraak verwijderen?')) {
      state.afspraken = state.afspraken.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'rol-nieuw') {
    openModal('Teamrol toevoegen', ROL_VELDEN, {}, function (d) {
      state.teamrollen.push({ id: uid('r'), rol: d.rol, eigenaars: d.eigenaars, backup: d.backup, taken: regelsNaarLijst(d.takenTekst) });
      log('Teamrol toegevoegd', 'Vaste afspraken', d.rol); save(); render(); toast('Teamrol toegevoegd.');
    });
    return;
  }
  if (act === 'rol-edit') {
    var rl = state.teamrollen.filter(function (x) { return x.id === id; })[0];
    if (!rl) return;
    openModal('Teamrol bewerken', ROL_VELDEN, { rol: rl.rol, eigenaars: rl.eigenaars, backup: rl.backup, takenTekst: rl.taken.join('\n') },
      function (d) {
        rl.rol = d.rol; rl.eigenaars = d.eigenaars; rl.backup = d.backup; rl.taken = regelsNaarLijst(d.takenTekst);
        log('Teamrol gewijzigd', 'Vaste afspraken', rl.rol + ' - eigenaar: ' + (rl.eigenaars || 'geen')); save(); render(); toast('Teamrol bijgewerkt.');
      });
    return;
  }
  if (act === 'rol-weg') {
    if (window.confirm('Deze teamrol verwijderen?')) {
      state.teamrollen = state.teamrollen.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'actie-gedaan') {
    var ag = state.acties.filter(function (x) { return x.id === id; })[0];
    if (!ag) return;
    openModal('Ik heb dit gedaan', [
      { k: 'voltooidDoor', l: 'Wie heeft het uitgevoerd?', t: 'select', opts: NAMEN },
      { k: 'afrondnotitie', l: 'Korte afrondnotitie', t: 'textarea', vol: true, hint: 'Wat is er precies gedaan? Dit leest de collega die controleert.' }
    ], { voltooidDoor: state.ikBen || ag.eigenaar }, function (d) {
      ag.voltooidDoor = d.voltooidDoor; ag.afrondnotitie = d.afrondnotitie;
      ag.voltooidOp = new Date().toISOString().slice(0, 10);
      ag.status = 'Ter controle'; ag.gewijzigd = ag.voltooidOp;
      log('Actie uitgevoerd, klaar voor controle', 'Acties', ag.titel + ' - door ' + ag.voltooidDoor); save(); render(); toast('Klaar voor controle.');
    });
    return;
  }
  if (act === 'actie-goedgekeurd') {
    var ac = state.acties.filter(function (x) { return x.id === id; })[0];
    if (!ac) return;
    openModal('Gecontroleerd', [{ k: 'controleDoor', l: 'Wie heeft dit gecontroleerd?', t: 'select', opts: NAMEN }],
      { controleDoor: state.ikBen }, function (d) {
        ac.controleDoor = d.controleDoor;
        ac.controleOp = new Date().toISOString().slice(0, 10);
        ac.status = 'Afgerond'; ac.gewijzigd = ac.controleOp;
        log('Actie gecontroleerd en afgerond', 'Acties', ac.titel + ' - door ' + ac.controleDoor); save(); render(); toast('Actie afgerond.');
      });
    return;
  }

  if (act === 'filter') {
    var mode = b.getAttribute('data-mode'), val = b.getAttribute('data-val');
    var f = { eigenaar: '', status: '', prioriteit: '', fase: '', kant: '', categorie: '', q: '', special: '' };
    if (mode === 'special') f.special = val;
    else if (mode === 'client') f.q = val;
    else if (mode) f[mode] = val;
    state.ui.filter = f; state.ui.tab = 'Acties'; save(); render(); return;
  }
  if (act === 'filter-wis') {
    state.ui.filter = { eigenaar: '', status: '', prioriteit: '', fase: '', kant: '', categorie: '', q: '', special: '' };
    save(); render(); return;
  }

  if (act === 'actie-nieuw') {
    verversClientOpties();
    openModal('Nieuwe actie', ACTIE_VELDEN, { status: 'Nog te doen', prioriteit: 'midden', fase: state.fase, kant: 'Team', categorie: 'Werkproces' }, function (d) {
      d.id = uid('a'); d.gewijzigd = new Date().toISOString().slice(0, 10);
      d.fase = Number(d.fase);
      state.acties.unshift(d); log('Actie toegevoegd', 'Acties', d.titel); save(); render(); toast('Actie toegevoegd.');
    });
    return;
  }
  if (act === 'actie-edit') {
    var a = state.acties.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    verversClientOpties();
    openModal('Actie bewerken', ACTIE_VELDEN, a, function (d) {
      Object.keys(d).forEach(function (k) { a[k] = k === 'fase' ? Number(d[k]) : d[k]; });
      a.gewijzigd = new Date().toISOString().slice(0, 10);
      log('Actie bijgewerkt', 'Acties', a.titel); save(); render(); toast('Actie bijgewerkt.');
    });
    return;
  }
  if (act === 'actie-af' || act === 'actie-heropen') {
    state.acties.forEach(function (x) {
      if (x.id === id) {
        x.status = act === 'actie-af' ? 'Afgerond' : 'Bezig';
        x.gewijzigd = new Date().toISOString().slice(0, 10);
        if (act === 'actie-af') { x.voltooidDoor = x.voltooidDoor || state.ikBen; x.voltooidOp = x.voltooidOp || x.gewijzigd; }
        log(act === 'actie-af' ? 'Actie afgerond' : 'Actie heropend', 'Acties', x.titel);
      }
    });
    save(); render(); return;
  }
  if (act === 'actie-weg') {
    var doel = state.acties.filter(function (x) { return x.id === id; })[0];
    if (doel && window.confirm('"' + doel.titel + '" verwijderen? Dit kan niet ongedaan gemaakt worden.')) {
      state.acties = state.acties.filter(function (x) { return x.id !== id; });
      log('Actie verwijderd', 'Acties', doel.titel); save(); render(); toast('Actie verwijderd.');
    }
    return;
  }

  if (act === 'client-nieuw') {
    openModal('Cliënt toevoegen', CLIENT_VELDEN, { kant: 'A-kant', lijn: 'n.v.t.', plan: 'Te controleren', signalering: 'Te controleren', afspraken: 'Te controleren', netwerk: 'Te controleren' }, function (d) {
      d.id = uid('c'); state.clienten.push(d); log('Cliënt toegevoegd', 'PB-overleg', d.naam); save(); render(); toast('Cliënt toegevoegd.');
    });
    return;
  }
  if (act === 'client-edit') {
    var c = state.clienten.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    openModal('Cliënt ' + c.naam, CLIENT_VELDEN, c, function (d) {
      Object.keys(d).forEach(function (k) { c[k] = d[k]; }); log('Cliëntgegevens gewijzigd', 'PB-overleg', c.naam); save(); render(); toast('Bijgewerkt.');
    });
    return;
  }
  if (act === 'client-weg') {
    var cl = state.clienten.filter(function (x) { return x.id === id; })[0];
    if (cl && window.confirm('Cliënt ' + cl.naam + ' uit dit overzicht verwijderen? Het dossier in het ECD verandert hier niet door.')) {
      state.clienten = state.clienten.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'kennis-nieuw') {
    openModal('Regel toevoegen', KENNIS_VELDEN, { status: 'Te controleren' }, function (d) {
      d.id = uid('k'); state.kennis.push(d); log('Kennisbron toegevoegd', 'Kennis', d.soort); save(); render(); toast('Toegevoegd.');
    });
    return;
  }
  if (act === 'kennis-edit') {
    var k = state.kennis.filter(function (x) { return x.id === id; })[0];
    if (!k) return;
    openModal('Regel bewerken', KENNIS_VELDEN, k, function (d) {
      Object.keys(d).forEach(function (kk) { k[kk] = d[kk]; }); log('Kennisbron gewijzigd', 'Kennis', k.soort + ' - ' + k.status); save(); render();
    });
    return;
  }
  if (act === 'kennis-weg') {
    if (window.confirm('Deze regel verwijderen uit het overzicht?')) {
      state.kennis = state.kennis.filter(function (x) { return x.id !== id; });
      save(); render();
    }
    return;
  }

  if (act === 'onboarding-wis') {
    if (window.confirm('Alle vinkjes van de inwerkroute wissen voor een nieuwe collega?')) {
      state.onboarding.forEach(function (c) { c.items.forEach(function (i) { i.done = false; }); });
      save(); render(); toast('Inwerkroute leeggemaakt.');
    }
    return;
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') sluitModal();
});

/* back-up: tekst die je kunt kopiëren of terugplakken */
document.getElementById('exportbtn').addEventListener('click', function () {
  var host = document.getElementById('modalhost');
  host.innerHTML = '<div class="overlay" data-act="overlay"><div class="modal">' +
    '<header><h3>Back-up van dit dashboard</h3><button class="btn sm ghost" data-act="modal-sluit" style="margin-left:auto">Sluiten</button></header>' +
    '<div class="body"><div class="veld"><label>Kopieer deze tekst en bewaar hem</label>' +
    '<textarea id="dump" style="min-height:190px;font-family:var(--mono);font-size:11px">' + esc(JSON.stringify(state)) + '</textarea>' +
    '<div class="hint">Plak hier een eerdere back-up en klik op Terugzetten om die versie te herstellen. ' +
    'De gegevens staan alleen in de browser van dit apparaat — deel de link met het team en iedereen houdt zijn eigen stand bij.</div></div></div>' +
    '<footer><button class="btn" data-act="modal-sluit">Sluiten</button><button class="btn primary" id="importbtn">Terugzetten</button></footer>' +
    '</div></div>';
  document.getElementById('importbtn').addEventListener('click', function () {
    try {
      var s = JSON.parse(document.getElementById('dump').value);
      if (!s || !s.acties) throw new Error('geen geldige back-up');
      state = s; state.ui = state.ui || seed().ui; save(); sluitModal(); render(); toast('Back-up teruggezet.');
    } catch (err) { toast('Dat is geen geldige back-up.'); }
  });
});

document.getElementById('zoektop').addEventListener('input', function (e) {
  state.ui.zoek = e.target.value;
  save();
  var pos = e.target.selectionStart;
  render();
  var el = document.getElementById('zoektop');
  if (el) {
    el.value = state.ui.zoek;
    el.focus();
    try { el.setSelectionRange(pos, pos); } catch (err) { /* zoekveld ondersteunt geen selectie */ }
  }
});

document.getElementById('printbtn').addEventListener('click', function () {
  try { window.print(); } catch (e) { toast('Gebruik Ctrl/Cmd + P om te printen.'); }
});

render();
syncOphalen(syncVolgen);
})();
</script>
