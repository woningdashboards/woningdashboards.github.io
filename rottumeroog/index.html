<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Rottumeroog Teamstabilisatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  /* Ipse de Bruggen huisstijl */
  --tenne:      #CD2D00;
  --navy:       #017ACB;
  --sky:        #009BFF;
  --jordy:      #80BDE5;
  --atlantis:   #96CD3C;

  --paper:      #F2EFEF;
  --surface:    #FFFFFF;
  --surface-2:  #F8F6F6;
  --line:       #E3DEDE;
  --line-soft:  #EDE9E9;
  --ink:        #282727;
  --ink-soft:   #5A5555;
  --ink-faint:  #8A8383;

  --ok:         #4F7D14;
  --ok-bg:      #EDF5E0;
  --warn:       #A5720A;
  --warn-bg:    #FAF0DC;
  --risk:       #CD2D00;
  --risk-bg:    #FBE7E1;
  --busy:       #017ACB;
  --busy-bg:    #E3F1FB;
  --idle-bg:    #EFECEC;

  --ring:       0 0 0 3px rgba(1,122,203,.22);
  --shadow:     0 1px 2px rgba(40,39,39,.05), 0 10px 24px -18px rgba(40,39,39,.35);
  --regel-bg:   #282727;
  --regel-fg:   #F7F5F5;
  --regel-line: #282727;

  --display: "Inter", Arial, Helvetica, sans-serif;
  --sans:    "Inter", Arial, Helvetica, sans-serif;
  --mono:    "Inter", Arial, Helvetica, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #16191B;
    --surface:    #1D2124;
    --surface-2:  #23282B;
    --line:       #313739;
    --line-soft:  #282D30;
    --ink:        #E9EAEA;
    --ink-soft:   #A9B0B2;
    --ink-faint:  #838B8D;
    --navy:       #4FA9EC;
    --sky:        #64BCFF;
    --ok:         #A8D95A;
    --ok-bg:      #1E2A15;
    --warn:       #E3B558;
    --warn-bg:    #2C2415;
    --risk:       #FF7A52;
    --risk-bg:    #331711;
    --busy:       #4FA9EC;
    --busy-bg:    #12242F;
    --idle-bg:    #262B2E;
    --ring:       0 0 0 3px rgba(79,169,236,.3);
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 24px -18px rgba(0,0,0,.9);
    --regel-bg:   #23282B;
    --regel-fg:   #E9EAEA;
    --regel-line: #313739;
  }
}
:root[data-theme="dark"] {
    --regel-bg:   #23282B;
    --regel-fg:   #E9EAEA;
    --regel-line: #313739;
  --paper:      #16191B;
  --surface:    #1D2124;
  --surface-2:  #23282B;
  --line:       #313739;
  --line-soft:  #282D30;
  --ink:        #E9EAEA;
  --ink-soft:   #A9B0B2;
  --ink-faint:  #838B8D;
  --navy:       #4FA9EC;
  --sky:        #64BCFF;
  --ok:         #A8D95A;
  --ok-bg:      #1E2A15;
  --warn:       #E3B558;
  --warn-bg:    #2C2415;
  --risk:       #FF7A52;
  --risk-bg:    #331711;
  --busy:       #4FA9EC;
  --busy-bg:    #12242F;
  --idle-bg:    #262B2E;
  --ring:       0 0 0 3px rgba(79,169,236,.3);
  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 24px -18px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1,h2,h3,h4 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -.011em; text-wrap: balance; }
p { margin: 0; max-width: 78ch; }
.uitleg { color: var(--ink-soft); font-size: 15px; max-width: 72ch; }
.uitleg + .uitleg { margin-top: 8px; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; }
input, select, textarea { font: inherit; color: inherit; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px); }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- topbar ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 11px; }
.brand .mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--tenne); flex: none;
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 15px;
}
.brand h1 { font-size: 17px; line-height: 1.1; }
.brand span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.zoek-top { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; width: 190px; }
.zoek-top:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring); width: 230px; }
@media (max-width: 560px) { .zoek-top { width: 100%; } .topbar-right { width: 100%; margin-left: 0; } }

.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; min-width: 0; flex: 1 1 100%; scrollbar-width: none; margin-top: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 9px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-faint); cursor: pointer;
  margin-bottom: -1px; white-space: nowrap; border-radius: 4px 4px 0 0;
}
.tabs button:hover { color: var(--ink); background: var(--surface-2); }
.tabs button.on { color: var(--navy); border-bottom-color: var(--navy); }
.tabs button:focus-visible { outline: none; box-shadow: var(--ring); }

/* ---------- knoppen ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-faint); color: var(--ink); }
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 35%, transparent); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

/* ---------- kaarten ---------- */
main { padding: clamp(18px, 3vw, 30px) 0 90px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(14px, 2.4vw, 20px); box-shadow: var(--shadow); }
.card > * + * { margin-top: 12px; }
.card h3 { font-size: 17px; }
.card h4 { font-size: 14.5px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g6 { grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
.section-title h2 { font-size: 19px; }
.section-title .hint { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; }
main > .wrap > .section-title:first-child { margin-top: 0; }

/* ---------- statistiek ---------- */
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 14px; text-align: left; cursor: pointer; box-shadow: var(--shadow); display: block; width: 100%; }
.stat:hover { border-color: var(--navy); }
.stat:focus-visible { outline: none; box-shadow: var(--ring); }
.stat .n { font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 600; }
.stat .l { font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; }
.stat.risk .n { color: var(--risk); }
.stat.warn .n { color: var(--warn); }
.stat.ok .n   { color: var(--ok); }
.stat.busy .n { color: var(--busy); }

.bar { height: 7px; border-radius: 4px; background: var(--idle-bg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); border-radius: 4px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.idle { background: var(--idle-bg); color: var(--ink-soft); }
.pill.busy { background: var(--busy-bg); color: var(--busy); }
.pill.block{ background: var(--risk-bg); color: var(--risk); }
.pill.check{ background: var(--warn-bg); color: var(--warn); }
.pill.done { background: var(--ok-bg); color: var(--ok); }
.pill.high { background: var(--risk-bg); color: var(--risk); }
.pill.mid  { background: var(--warn-bg); color: var(--warn); }
.pill.low  { background: var(--idle-bg); color: var(--ink-faint); }
.pill.fase { background: var(--busy-bg); color: var(--busy); }
.pill.line { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }

/* ---------- cliëntwaarde ---------- */
.waarde { border: 1px solid color-mix(in srgb, var(--tenne) 30%, var(--line)); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.waarde .kop { background: var(--tenne); color: #fff; padding: 12px 18px; }
.waarde .kop h2 { font-size: 17px; color: #fff; }
.waarde .kop p { font-size: 13px; opacity: .92; margin-top: 2px; }
.waarde .body { padding: 16px 18px; display: grid; gap: 10px; }
.waarde .item { display: grid; grid-template-columns: 9px 1fr; gap: 12px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
.waarde .item:last-child { border-bottom: 0; padding-bottom: 0; }
.waarde .item::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tenne); margin-top: 8px; }
.waarde .item b { font-weight: 600; }
.waarde .item small { display: block; color: var(--ink-faint); font-family: var(--mono); font-size: 11px; margin-top: 3px; }

/* ---------- regel-blok ---------- */
.regel { border-radius: 12px; background: var(--regel-bg); color: var(--regel-fg); padding: 18px 20px; border: 1px solid var(--regel-line); }
.regel h3 { font-family: var(--display); font-size: 20px; letter-spacing: .01em; color: inherit; }
.regel p { color: inherit; opacity: .82; font-size: 14px; margin-top: 6px; }
.regel ol { counter-reset: r; margin-top: 14px; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.regel ol li { counter-increment: r; display: grid; grid-template-columns: 20px 1fr; gap: 9px; font-size: 13.5px; opacity: .92; }
.regel ol li::before { content: counter(r); font-family: var(--mono); font-size: 11px; opacity: .65; }

/* ---------- lijsten / tabellen ---------- */
.rows { display: grid; }
.row { display: grid; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.row:last-child { border-bottom: 0; }
.tabelwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-faint); font-weight: 400; text-align: left; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tr:last-child td { border-bottom: 0; }

/* ---------- checklist ---------- */
.check { display: grid; grid-template-columns: 18px 1fr; gap: 11px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border: 1.5px solid var(--ink-faint); border-radius: 4px; background: var(--surface); position: relative; top: 3px; cursor: pointer; flex: none; }
.check input:checked { background: var(--ok); border-color: var(--ok); }
.check input:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid #fff; border-width: 0 1.7px 1.7px 0; transform: rotate(43deg); }
:root[data-theme="dark"] .check input:checked::after { border-color: #16191B; }
.check input:focus-visible { outline: none; box-shadow: var(--ring); }
.check.done span { color: var(--ink-faint); text-decoration: line-through; }
.check span { font-size: 14.5px; }

/* ---------- actieboard ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 13px;
}
.filters select:focus, .filters input:focus { outline: none; box-shadow: var(--ring); border-color: var(--navy); }
.actie { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 9px; }
.actie.overdue { border-color: color-mix(in srgb, var(--risk) 45%, var(--line)); }
.actie .top { display: flex; gap: 10px; align-items: flex-start; }
.actie .titel { font-weight: 600; font-size: 15px; flex: 1; }
.actie .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.actie .cw { font-size: 13px; color: var(--ink-soft); background: var(--surface-2); border-left: 2px solid var(--tenne); padding: 7px 10px; border-radius: 0 6px 6px 0; }
.actie .cw b { color: var(--ink); font-weight: 600; }
.actie .cw.leeg { border-left-color: var(--warn); color: var(--warn); }
.actie .acties { display: flex; gap: 6px; flex-wrap: wrap; }
.actie .next { font-size: 13px; color: var(--ink-soft); }
.leeg-melding { text-align: center; padding: 40px 20px; color: var(--ink-faint); font-size: 14px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,20,20,.5); display: grid; place-items: center; padding: 16px; z-index: 100; }
.modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); width: min(620px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--surface); border-radius: 14px 14px 0 0; }
.modal header h3 { font-size: 17px; }
.modal .body { padding: 18px 20px; display: grid; gap: 14px; }
.modal footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
.veld { display: grid; gap: 5px; }
.veld label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-faint); }
.veld input, .veld select, .veld textarea {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; width: 100%;
}
.veld textarea { min-height: 66px; resize: vertical; font-family: var(--sans); }
.veld input:focus, .veld select:focus, .veld textarea:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring); }
.veld .hint { font-size: 12px; color: var(--ink-faint); }
.veld-rij { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 200; box-shadow: var(--shadow); }

.routing { display: grid; gap: 8px; }
.routing .r { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.routing .r:last-child { border-bottom: 0; }
.routing .r b { font-weight: 500; font-size: 14.5px; }
.routing .r .naar { font-family: var(--mono); font-size: 12px; color: var(--navy); }

.persoon { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.persoon .av { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 14px; color: #fff; }
.persoon h4 { font-size: 15.5px; }
.persoon .rol { font-family: var(--mono); font-size: 11px; color: var(--navy); letter-spacing: .04em; }
.persoon ul { margin-top: 8px; display: grid; gap: 3px; }
.persoon ul li { font-size: 13.5px; color: var(--ink-soft); padding-left: 13px; position: relative; }
.persoon ul li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--jordy); }

.kijkwijzer { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.kijkwijzer div { border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; background: var(--surface-2); }
.kijkwijzer b { display: block; font-size: 13.5px; }
.kijkwijzer span { font-size: 13px; color: var(--ink-soft); }

.flow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 6px; }
.flow .s { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; font-size: 13px; }
.flow .a { color: var(--ink-faint); font-size: 13px; }

/* ---------- waar staan we nu ---------- */
.nu { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 12px; padding: clamp(16px, 2.6vw, 24px); box-shadow: var(--shadow); display: grid; gap: 16px; }
.nu-kop { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.nu-kop h2 { font-size: clamp(21px, 3.2vw, 27px); margin-top: 4px; }
.nu-kop .pill { margin-left: auto; }
.kernzin { font-size: 17px; font-weight: 600; color: var(--navy); max-width: 62ch; }
.meta-regel { font-size: 13.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.kolommen { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.kop-rij { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.kop-rij h4 { flex: 1; }
.nu h4, .fase-body h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }

.genummerd { counter-reset: g; display: grid; gap: 5px; }
.genummerd li { counter-increment: g; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; }
.genummerd li::before { content: counter(g) "."; color: var(--navy); font-weight: 600; }
.vinklijst { display: grid; gap: 5px; }
.vinklijst li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 15px; }
.vinklijst li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.stiplijst { display: grid; gap: 5px; }
.stiplijst li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 15px; }
.stiplijst li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--jordy); margin-top: 9px; }

/* ---------- fase-accordeon ---------- */
.fase-kaart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(15px, 2.4vw, 20px); box-shadow: var(--shadow); display: grid; gap: 12px; }
.fase-kaart.hier { border-color: var(--navy); border-width: 1.5px; }
.fase-kop { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.fase-nr { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; flex: none; }
.fase-kop .titelblok { flex: 1; min-width: 180px; }
.fase-kop h3 { font-size: 19px; }
.fase-kop .periode { font-size: 13px; color: var(--ink-faint); }
.fase-body { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 20px; }
.letten-lijst { display: grid; }
.letten-lijst > div { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.letten-lijst > div:last-child { border-bottom: 0; }
.letten-lijst b { display: block; font-size: 14.5px; }
.letten-lijst span { font-size: 14.5px; color: var(--ink-soft); }
.verwacht-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.verwacht-grid > div { background: var(--surface-2); border-radius: 10px; padding: 13px 15px; }
.verwacht-grid .wie { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.reflectie { background: var(--warn-bg); border-radius: 10px; padding: 14px 16px; }

function migreer(s) {
  var basis = seed();
  s.ui = s.ui || basis.ui;
  s.ui.filter = s.ui.filter || basis.ui.filter;
  if (TABS.indexOf(s.ui.tab) === -1) s.ui.tab = 'Overzicht';
  if (!s.focusPunten) s.focusPunten = basis.focusPunten;
  if (!s.weekPunten) s.weekPunten = basis.weekPunten;
  if (!s.afspraken) s.afspraken = basis.afspraken;
  if (!s.teamrollen) s.teamrollen = basis.teamrollen;
  if (!s.pb) s.pb = {};
  if (!s.medewerkers) s.medewerkers = basis.medewerkers;
  if (!s.procedures) s.procedures = basis.procedures;
  if (!s.procedures.vmsStappen || !s.procedures.vmsStappen.length) s.procedures.vmsStappen = VMS_STAPPEN.slice();

  if (!s.defecten) s.defecten = [];
  if (!s.verbeterpunten) s.verbeterpunten = [];
  if (!s.log) s.log = [];
  if (s.ikBen == null) s.ikBen = '';
  s.acties.forEach(function (a) {
    if (a.status === 'Controle nodig') a.status = 'Ter controle';
    if (a.controle == null) a.controle = a.prioriteit === 'hoog' ? 'Ja' : 'Nee';

/* Dit delen we. De rest (welk tabblad je openhebt, wie je bent) blijft per apparaat. */
var GEDEELD = ['fase', 'focus', 'focusPunten', 'weekPunten', 'fases', 'acties', 'afspraken',
  'teamrollen', 'clienten', 'kennis', 'pb', 'procedures', 'vms', 'defecten', 'verbeterpunten',

var CODE_KEY = KEY + '-code';
var sync = { laatst: '', vorige: '', status: 'uit', timerSchrijf: 0, timerLees: 0 };

function syncMogelijk() { return !!(SYNC.url && SYNC.sleutel); }

function magWijzigen() {
  if (!syncMogelijk()) return true;   /* geen gedeelde opslag: gewoon lokaal werken */
  if (!SYNC.code) return true;
  try { return localStorage.getItem(CODE_KEY) === SYNC.code; } catch (e) { return false; }
}

function gedeeldDeel(s) {
  var o = {};
  GEDEELD.forEach(function (k) { o[k] = s[k]; });
  return o;
}

function syncVerzoek(pad, opties) {
  opties = opties || {};
  var kop = { apikey: SYNC.sleutel, Authorization: 'Bearer ' + SYNC.sleutel, 'Content-Type': 'application/json' };
  Object.keys(opties.headers || {}).forEach(function (k) { kop[k] = opties.headers[k]; });
  opties.headers = kop;
  return fetch(SYNC.url.replace(/\/+$/, '') + '/rest/v1/' + pad, opties);
}

function syncStatus(st) {
  sync.status = st;
  var el = document.getElementById('syncpil');
  if (!el) return;
  var tekst = '', soort = 'idle';
  if (st === 'live') {
    tekst = magWijzigen() ? 'Gedeeld · je kunt wijzigen' : 'Gedeeld · alleen lezen';
    soort = magWijzigen() ? 'done' : 'busy';
  } else if (st === 'offline') { tekst = 'Geen verbinding'; soort = 'block'; }
  el.className = 'pill ' + soort;
  el.textContent = tekst;
  el.style.display = tekst ? '' : 'none';
}

/* Het logboek is van iedereen samen: bij het overnemen voegen we de regels
   samen in plaats van ze te overschrijven. */
function mengLog(a, b) {
  var gezien = {}, uit = [];
  (a || []).concat(b || []).forEach(function (r) {
    if (!r) return;
    var sleutel = r.ts + '|' + r.wie + '|' + r.wat + '|' + (r.detail || '');
    if (gezien[sleutel]) return;
    gezien[sleutel] = 1; uit.push(r);
  });
  uit.sort(function (x, y) { return String(y.ts).localeCompare(String(x.ts)); });
  return uit.slice(0, 300);
}

function vensterOpen() {
  var h = document.getElementById('modalhost');
  return !!(h && h.innerHTML !== '');
}

function neemOver(binnen) {
  if (!binnen || vensterOpen()) return;
  var eigenLog = state.log || [];
  GEDEELD.forEach(function (k) { if (binnen[k] != null) state[k] = binnen[k]; });
  state.log = mengLog(eigenLog, binnen.log || []);
  state = migreer(state);
  sync.vorige = JSON.stringify(gedeeldDeel(state));
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* opslag vol of geblokkeerd */ }
  render();
}

function syncOphalen(daarna) {
  if (!syncMogelijk()) { syncStatus('uit'); if (daarna) daarna(); return; }
  syncVerzoek('dashboards?id=eq.' + encodeURIComponent(SYNC.rij) + '&select=state,updated_at')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rijen) {
      syncStatus('live');
      if (rijen && rijen.length) {
        sync.laatst = rijen[0].updated_at || '';
        neemOver(rijen[0].state);
      }
      if (daarna) daarna();
    })
    .catch(function () { syncStatus('offline'); if (daarna) daarna(); });
}

function syncSchrijven() {
  if (!syncMogelijk() || !magWijzigen()) return;
  var nu = JSON.stringify(gedeeldDeel(state));
  if (nu === sync.vorige) return;      /* alleen het scherm veranderde, niet de inhoud */
  sync.vorige = nu;
  clearTimeout(sync.timerSchrijf);
  sync.timerSchrijf = setTimeout(syncDuwen, 700);
}

function syncDuwen() {
  var rij = [{ id: SYNC.rij, state: gedeeldDeel(state), updated_at: new Date().toISOString(),
               updated_by: state.ikBen || 'onbekend' }];
  syncVerzoek('dashboards', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(rij)
  })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (uit) {
      if (uit && uit.length && uit[0].updated_at) sync.laatst = uit[0].updated_at;
      syncStatus('live');
    })
    .catch(function () { syncStatus('offline'); });
}

function syncVolgen() {
  if (!syncMogelijk()) return;
  clearInterval(sync.timerLees);
  sync.timerLees = setInterval(function () {
    if (document.hidden || vensterOpen()) return;
    syncVerzoek('dashboards?id=eq.' + encodeURIComponent(SYNC.rij) + '&select=state,updated_at')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rijen) {
        syncStatus('live');
        if (!rijen || !rijen.length) return;
        if (rijen[0].updated_at && rijen[0].updated_at !== sync.laatst) {
          sync.laatst = rijen[0].updated_at;
          neemOver(rijen[0].state);
        }
      })
      .catch(function () { syncStatus('offline'); });
  }, SYNC.tempo);
}

/* =========================================================================
   3. HULPJES
   ========================================================================= */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function vandaag() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }

/* Wijzigingsgeschiedenis: wie heeft wat wanneer veranderd.
   We bewaren de laatste 300 regels, zodat de opslag niet oneindig groeit. */
function log(wat, waar, detail) {
  state.log.unshift({
    id: uid('l'),
    ts: new Date().toISOString(),
    wie: state.ikBen || 'onbekend',
    wat: wat, waar: waar || '', detail: detail || ''
  });
  if (state.log.length > 300) state.log.length = 300;
}

function tijdNL(ts) {
  var d = new Date(ts);
  if (isNaN(d)) return '—';
  var vandaagStr = new Date().toDateString();
  var tijd = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if (d.toDateString() === vandaagStr) return 'vandaag ' + tijd;
  return datumNL(d.toISOString().slice(0, 10)) + ' · ' + tijd;
}
function isOverdue(a) {
  if (!a.deadline || a.status === 'Afgerond') return false;
  return new Date(a.deadline + 'T00:00:00') < vandaag();
}
function datumNL(s) {
  if (!s) return '—';
  var d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return esc(s);
  var m = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}
function statusClass(s) {
  return { 'Nog te doen': 'idle', 'Bezig': 'busy', 'Geblokkeerd': 'block', 'Ter controle': 'check', 'Afgerond': 'done' }[s] || 'idle';
}
function docClass(s) {
  return { 'Actueel': 'done', 'Behouden': 'done', 'Te controleren': 'check', 'Verplaatsen': 'busy',
           'Verouderd': 'block', 'Archiveren': 'idle', 'Duplicaat': 'idle', 'Verwijderen na controle': 'block' }[s] || 'idle';
}
function prioClass(p) { return { hoog: 'high', midden: 'mid', laag: 'low' }[p] || 'low'; }
function pct(done, total) { return total ? Math.round((done / total) * 100) : 0; }
function fasePct(n) {
  var f = state.fases.filter(function (x) { return x.n === n; })[0];
  if (!f) return 0;
  return pct(f.items.filter(function (i) { return i.done; }).length, f.items.length);
}
function totaalPct() {
  var d = 0, t = 0;
  state.fases.forEach(function (f) { f.items.forEach(function (i) { t++; if (i.done) d++; }); });
  return pct(d, t);
}
function kantPct(kant) {
  var rel = state.acties.filter(function (a) { return a.kant === kant; });
  if (!rel.length) return 0;
  return pct(rel.filter(function (a) { return a.status === 'Afgerond'; }).length, rel.length);
}
function toast(txt) {
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = txt;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2200);
}

            Overleggen: viewOverleggen, Bekwaamheid: viewBekwaam, Team: viewTeam, Kennis: viewKennis, Inwerken: viewInwerken,

    return '<div class="fase-kaart' + (huidig ? ' hier' : '') + '">' + kop + samenvatting + body + '</div>';

function verversClientOpties() {
  ACTIE_VELDEN.forEach(function (v) {
    if (v.k === 'client') v.opts = [''].concat(state.clienten.map(function (c) { return c.naam; }));
  });
}

function filterActies() {
  var f = state.ui.filter;
  return state.acties.filter(function (a) {
    if (f.special === 'open' && a.status === 'Afgerond') return false;
    if (f.special === 'verlopen' && !isOverdue(a)) return false;
    if (f.special === 'geen-eigenaar' && (a.eigenaar || a.status === 'Afgerond')) return false;
    if (f.eigenaar && a.eigenaar !== f.eigenaar) return false;
    if (f.status && a.status !== f.status) return false;
    if (f.prioriteit && a.prioriteit !== f.prioriteit) return false;
    if (f.fase && String(a.fase) !== String(f.fase)) return false;
    if (f.kant && a.kant !== f.kant) return false;
    if (f.categorie && a.categorie !== f.categorie) return false;
    if (f.q) {
      var q = f.q.toLowerCase();
      var hay = (a.titel + ' ' + a.eigenaar + ' ' + a.betrokken + ' ' + a.notitie + ' ' + a.clientwaarde + ' ' + a.client).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    var af = a.status === 'Afgerond' ? 1 : 0, bf = b.status === 'Afgerond' ? 1 : 0;
    if (af !== bf) return af - bf;
    var ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    var ap = PRIOS.indexOf(a.prioriteit), bp = PRIOS.indexOf(b.prioriteit);
    if (ap !== bp) return ap - bp;
    return (a.deadline || '9999').localeCompare(b.deadline || '9999');
  });
}

function sel(name, opts, cur, leeg) {
  return '<select data-filter="' + name + '"><option value="">' + esc(leeg) + '</option>' +
    opts.map(function (o) { return '<option value="' + esc(o) + '"' + (String(cur) === String(o) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
    '</select>';
}

  }).join('');
  h += '</div>';
  return h;
}

/* ---------- Presentatie: één definitie voor het scherm én de PowerPoint ---------- */

var PRES_OPTIES = [
  ['proces', 'Stabilisatieproces'], ['fase', 'Huidige fase'], ['bezig', 'Waar we nu mee bezig zijn'],
  ['gelukt', 'Wat is al gelukt'], ['acties', 'Open acties'], ['rollen', 'Teamrollen'],
  ['bellen', 'Wie bel ik wanneer'], ['visie', 'Begeleidingsvisie'], ['overleg', 'Overdracht & vergadering'],
  ['verbeter', 'Verbeterpunten'], ['stappen', 'Volgende stappen']
];

function standaardOpties() {
  var o = {};
  PRES_OPTIES.forEach(function (p) { o[p[0]] = true; });
  return o;
}

function overlegOpties() {
  var o = {};
  PRES_OPTIES.forEach(function (p) { o[p[0]] = false; });
  ['fase', 'gelukt', 'acties', 'rollen', 'verbeter', 'stappen'].forEach(function (k) { o[k] = true; });
  return o;
}

function presentatieDias(opt) {
  opt = opt || standaardOpties();
  var fase = FASES.filter(function (f) { return f.n === state.fase; })[0];
  var open_ = state.acties.filter(function (a) { return a.status !== 'Afgerond'; });
  var klaar = state.acties.filter(function (a) { return a.status === 'Afgerond'; });
  var dias = [];

  dias.push({ soort: 'titel', titel: 'Rottumeroog', sub: 'Teamstabilisatie',
    kern: 'Waar staan we, waar werken we aan en wat is onze volgende stap?',
    voet: 'Ipse de Bruggen · Rottumeroog · ' + datumNL(new Date().toISOString().slice(0, 10)) });

  dias.push({ soort: 'kern', titel: 'Waarom doen we dit?',
    chips: ['Rust', 'Duidelijkheid', 'Eenduidigheid', 'Vakmanschap', 'Eigenaarschap', 'Stabiliteit'],
    kern: 'Het doel is niet om meer regels te maken. Het doel is om het makkelijker te maken om goede zorg te leveren.' });

  if (opt.proces) {
    dias.push({ soort: 'fases', titel: 'Onze route',
      items: FASES.map(function (f) {
        return { n: f.n, naam: f.naam, periode: f.periode, hier: f.n === state.fase, pct: fasePct(f.n) };
      }) });
  }

  if (opt.fase) {
    dias.push({ soort: 'fase', titel: 'Fase ' + fase.n + ' — ' + fase.naam,
      kern: fase.kernzin, tekst: fase.waarom[0],

      punten: state.focusPunten.slice(0, 5), puntenKop: 'Onze focus op dit moment' });

  if (opt.bezig) {

        { kop: 'Triple-C', items: ['Wat heeft deze persoon nodig?', 'Voelt hij zich veilig?', 'Heeft de dag betekenis?'] },
        { kop: 'LACCS', items: ['Lichamelijk welzijn', 'Alertheid', 'Contact', 'Communicatie', 'Stimulerende tijdsbesteding'] }
      ],
      kern: 'Minder woorden. Meer rust. Meer voorspelbaarheid. Eerst contact, daarna de vraag.' });

      kern: 'Eén gebeurtenis → overdracht. Een terugkerend patroon of een besluit nodig → teamoverleg of PB-overleg.' });

  if (opt.verbeter) {

  }

  dias.push({ soort: 'groot', titel: 'Wat verwachten we van elkaar?',
    groot: 'Zie je iets dat beter kan? Geef het aan.',
    punten: ['Zie het', 'Benoem het', 'Denk mee', 'Zet een actie uit', 'Kijk of het verbeterd is'],
    kern: 'Alleen blijven klagen zonder iets bespreekbaar te maken, brengt geen verandering.' });

  if (opt.stappen) {
    var top = open_.slice().sort(function (a, b) { return PRIOS.indexOf(a.prioriteit) - PRIOS.indexOf(b.prioriteit); }).slice(0, 5);
    dias.push({ soort: 'acties', titel: 'Waar gaan we nu mee verder?',
      items: top.map(function (a) {
        return { titel: a.titel, eigenaar: a.eigenaar || 'geen eigenaar', deadline: datumNL(a.deadline), status: a.status };
      }),
      kern: 'Volgende keer kijken we niet alleen wat we hebben besproken, maar vooral wat er daadwerkelijk is gebeurd.' });
  }

  return dias;
}

/* ---------- Zoeken over het hele dashboard ---------- */
function zoekIndex() {
  var ix = [];
  function add(tab, titel, tekst, extra) { ix.push({ tab: tab, titel: titel, tekst: tekst || '', extra: extra || null }); }

  begeleidenBlokken().forEach(function (b) { add('Begeleiden', b.titel, b.woorden, { begeleidenQ: b.titel.split(' ')[0] }); });
  SITUATIES.forEach(function (s) { add('Begeleiden', 'Wat doe ik als: ' + s.titel, s.woorden + ' ' + s.stappen.join(' '), { situatie: s.id }); });
  BASISHOUDING.forEach(function (b) { add('Begeleiden', 'Basishouding: ' + b[0], b[1], null); });
  LACCS.forEach(function (l) { add('Begeleiden', 'LACCS: ' + l[0], l[1].join(' '), { begeleidenQ: 'laccs' }); });
  SPANNING.forEach(function (s) { add('Begeleiden', 'Spanning ' + s.k + ' — ' + s.t, s.beeld + ' ' + s.doen.join(' '), { begeleidenQ: 'spanning' }); });

  WIE_NODIG.forEach(function (w) { add('Wie heb ik nodig?', w[0], w[1] + ' ' + w[2].join(' '), null); });
  ROLKAARTEN.forEach(function (r) { add('Wie heb ik nodig?', r.naam, r.kop + ' ' + r.waarvoor + ' ' + r.lijst.join(' '), null); });

  add('Procedures', 'Hoe maak ik een VMS?', 'vms melden incident melding meldsysteem ' + state.procedures.vmsStappen.join(' '), null);
  MEDISCH_NIVEAUS.forEach(function (m) { add('Procedures', 'Medisch: ' + m[0], m[2] + ' ' + m[3].join(' '), null); });
  add('Procedures', 'Iets kapot — defectmelding', 'kapot defect stuk technisch melden reparatie ' + DEFECT_NEE.join(' '), null);
  state.vms.forEach(function (v) { add('Procedures', 'VMS bij cliënt ' + v.client, v.wanneer + ' ' + v.bijzonder, null); });

  FASES.forEach(function (f) { add('Route', 'Fase ' + f.n + ' — ' + f.naam, f.kernzin + ' ' + f.doel, { openFase: f.n }); });
  state.acties.forEach(function (a) { add('Acties', a.titel, a.uitleg + ' ' + a.notitie + ' ' + a.categorie + ' ' + a.eigenaar, { q: a.titel }); });
  state.afspraken.forEach(function (a) { add('Vaste afspraken', a.functie + ' — ' + a.ritme, a.tekst, null); });
  state.teamrollen.forEach(function (r) { add('Vaste afspraken', 'Teamrol: ' + r.rol, r.taken.join(' ') + ' ' + r.eigenaars, null); });
  state.clienten.forEach(function (c) { add('PB-overleg', 'Cliënt ' + c.naam, c.kant + ' ' + c.pb + ' ' + c.lijn, { pbClient: c.naam }); });
  PB_ONDERDELEN.forEach(function (o) { add('PB-overleg', 'PB-overleg: ' + o[1], o[3].join(' '), null); });
  VAARDIGHEDEN.forEach(function (cat) {
    cat[2].forEach(function (v) { add('Bekwaamheid', v[1], cat[0] + ' ' + v[2], null); });
  });
  MENSEN.forEach(function (m) { add('Team', m.naam, m.rol + ' ' + m.taken.join(' '), null); });
  state.kennis.forEach(function (k) { add('Kennis', k.soort, k.bron + ' ' + k.notitie, null); });
  state.onboarding.forEach(function (c) {
    c.items.forEach(function (i) { add('Inwerken', c.cat + ': ' + i.t, '', null); });
  });
  return ix;
}

function viewZoek() {
  var q = state.ui.zoek.toLowerCase().trim();
  /* Korte zoekwoorden (AR, VMS, PAT) alleen als heel woord — anders matcht "AR" ook in "waar" en "naar". */
  var kort = q.length <= 3;
  var re = null;
  if (kort) {
    try { re = new RegExp('(^|[^a-z0-9])' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)', 'i'); }
    catch (e) { re = null; }
  }
  var res = zoekIndex().filter(function (r) {
    var hooi = r.titel + ' ' + r.tekst + ' ' + r.tab;
    return re ? re.test(hooi) : hooi.toLowerCase().indexOf(q) !== -1;
  });

  var perTab = {};
  res.forEach(function (r) { (perTab[r.tab] = perTab[r.tab] || []).push(r); });

  var h = '<div class="section-title"><h2>Waar vind ik “' + esc(state.ui.zoek) + '”?</h2>' +
    '<span class="hint">' + res.length + ' resultaat' + (res.length === 1 ? '' : 'en') + '</span></div>';

  if (!res.length) {
    h += '<div class="card"><p class="uitleg">Niets gevonden. Probeer een ander woord — bijvoorbeeld <em>slaan</em>, <em>epilepsie</em>, ' +
      '<em>voorraad</em>, <em>inwerken</em>, <em>medicatie</em> of de naam van een cliënt.</p>' +
      '<button class="btn" data-act="zoek-top-wis">Terug naar het dashboard</button></div>';
    return h;
  }

  h += '<div class="card"><button class="btn sm" data-act="zoek-top-wis">Zoeken sluiten</button></div>';
  h += '<div class="grid" style="margin-top:14px">' + Object.keys(perTab).map(function (tab) {
    return '<div class="card"><div class="kop-rij"><h3>' + esc(tab) + '</h3>' +
      '<span class="pill line">' + perTab[tab].length + '</span></div>' +
      perTab[tab].slice(0, 12).map(function (r) {
        return '<div class="afspraak"><div><div class="tekst">' + esc(r.titel) + '</div>' +
          (r.tekst ? '<div class="wie">' + esc(r.tekst.slice(0, 150)) + (r.tekst.length > 150 ? '…' : '') + '</div>' : '') + '</div>' +
          '<button class="btn sm" data-act="zoek-ga" data-tab="' + esc(tab) + '" ' +
          'data-extra="' + esc(JSON.stringify(r.extra || {})) + '">Open</button></div>';
      }).join('') +
      (perTab[tab].length > 12 ? '<p class="uitleg">en nog ' + (perTab[tab].length - 12) + ' resultaten op deze pagina.</p>' : '') +
      '</div>';
  }).join('') + '</div>';
  return h;
}

  if (!state.pb[naam]) state.pb[naam] = { hoe: '', velden: {}, datum: '', volgende: '' };

function regelsNaarLijst(s) {
  return String(s || '').split('\n').map(function (r) { return r.trim(); }).filter(Boolean);

function openModal(titel, velden, obj, onSave) {
  var host = document.getElementById('modalhost');
  var body = '';
  var i = 0;
  while (i < velden.length) {
    var v = velden[i];
    if (v.vol) { body += veldHtml(v, obj); i++; continue; }
    var v2 = velden[i + 1];
    if (v2 && !v2.vol) { body += '<div class="veld-rij">' + veldHtml(v, obj) + veldHtml(v2, obj) + '</div>'; i += 2; }
    else { body += veldHtml(v, obj); i++; }
  }
  host.innerHTML = '<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">' +
    '<header><h3>' + esc(titel) + '</h3><button class="btn sm ghost" data-act="modal-sluit" style="margin-left:auto">Sluiten</button></header>' +
    '<div class="body">' + body + '</div>' +
    '<footer><button class="btn" data-act="modal-sluit">Annuleren</button>' +
    '<button class="btn primary" data-act="modal-opslaan">Opslaan</button></footer></div></div>';

  host._save = function () {
    var data = {};
    velden.forEach(function (v) {
      var el = host.querySelector('[name="' + v.k + '"]');
      if (el) data[v.k] = el.value.trim();
    });
    if (!velden[0].optioneel && !data[velden[0].k]) { toast('Vul in elk geval een ' + velden[0].l.toLowerCase() + ' in.'); return; }
    onSave(data);
    sluitModal();
  };
  var first = host.querySelector('input, select, textarea');
  if (first) first.focus();
}

function veldHtml(v, obj) {
  var val = obj && obj[v.k] != null ? obj[v.k] : '';
  var inner;
  if (v.t === 'select') {
    inner = '<select id="veld-' + v.k + '" name="' + v.k + '">' + v.opts.map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(val) === String(o) ? ' selected' : '') + '>' + (o === '' ? '— geen —' : esc(o)) + '</option>';
    }).join('') + '</select>';
  } else if (v.t === 'textarea') {
    inner = '<textarea id="veld-' + v.k + '" name="' + v.k + '">' + esc(val) + '</textarea>';
  } else {
    inner = '<input id="veld-' + v.k + '" type="' + v.t + '" name="' + v.k + '" value="' + esc(val) + '">';
  }
  return '<div class="veld"><label for="veld-' + v.k + '">' + esc(v.l) + '</label>' + inner +
    (v.hint ? '<div class="hint">' + esc(v.hint) + '</div>' : '') + '</div>';
}

function sluitModal() { document.getElementById('modalhost').innerHTML = ''; }

    s.background = { color: PPT.wit };

    if (d.soort === 'titel') {
      s.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 0.35, h: 5.63, fill: { color: PPT.tenne } });
      pptTekst(s, d.titel, { x: 0.9, y: 1.5, w: 8.4, h: 1.0, fontSize: 44, bold: true, color: PPT.ink, fontFace: 'Calibri' });
      pptTekst(s, d.sub, { x: 0.9, y: 2.5, w: 8.4, h: 0.6, fontSize: 26, color: PPT.navy, fontFace: 'Calibri' });
      pptTekst(s, d.kern, { x: 0.9, y: 3.2, w: 8.4, h: 0.8, fontSize: 16, color: PPT.grijs, fontFace: 'Calibri' });
      pptTekst(s, d.voet, { x: 0.9, y: 4.6, w: 8.4, h: 0.4, fontSize: 12, color: PPT.grijs, fontFace: 'Calibri' });
      return;
    }

    pptTekst(s, d.titel, { x: 0.6, y: 0.4, w: 9.0, h: 0.8, fontSize: 30, bold: true, color: PPT.ink, fontFace: 'Calibri' });
    s.addShape(pptx.ShapeType.rect, { x: 0.6, y: 1.15, w: 1.4, h: 0.05, fill: { color: PPT.tenne } });
    var y = 1.5;

    if (d.chips && d.chips.length) {
      pptTekst(s, d.chips.join('   ·   '), { x: 0.6, y: y, w: 9.0, h: 0.5, fontSize: 17, bold: true, color: PPT.navy, fontFace: 'Calibri' });
      y += 0.7;
    }
    if (d.tekst) {
      pptTekst(s, d.tekst, { x: 0.6, y: y, w: 9.0, h: 0.9, fontSize: 15, color: PPT.grijs, fontFace: 'Calibri' });
      y += 1.0;
    }
    if (d.groot) {
      pptTekst(s, d.groot, { x: 0.6, y: y, w: 9.0, h: 1.0, fontSize: 32, bold: true, color: PPT.tenne, fontFace: 'Calibri' });
      y += 1.2;
    }
    if (d.stats) {
      d.stats.forEach(function (st, i) {
        var x = 0.6 + i * 2.3;
        s.addShape(pptx.ShapeType.roundRect, { x: x, y: y, w: 2.1, h: 1.0, fill: { color: PPT.licht }, rectRadius: 0.08 });
        pptTekst(s, String(st.n), { x: x, y: y + 0.08, w: 2.1, h: 0.5, fontSize: 24, bold: true, color: PPT.navy, align: 'center', fontFace: 'Calibri' });
        pptTekst(s, st.l, { x: x, y: y + 0.55, w: 2.1, h: 0.35, fontSize: 11, color: PPT.grijs, align: 'center', fontFace: 'Calibri' });
      });
      y += 1.3;
    }
    if (d.soort === 'fases') {
      d.items.forEach(function (f, i) {
        var x = 0.6 + i * 1.83;
        s.addShape(pptx.ShapeType.roundRect, { x: x, y: y, w: 1.7, h: 1.9,
          fill: { color: f.hier ? PPT.navy : PPT.licht }, rectRadius: 0.08 });
        pptTekst(s, 'Fase ' + f.n, { x: x, y: y + 0.15, w: 1.7, h: 0.3, fontSize: 12, bold: true,
          color: f.hier ? PPT.wit : PPT.grijs, align: 'center', fontFace: 'Calibri' });
        pptTekst(s, f.naam, { x: x + 0.08, y: y + 0.5, w: 1.54, h: 0.8, fontSize: 12, bold: true,
          color: f.hier ? PPT.wit : PPT.ink, align: 'center', fontFace: 'Calibri' });
        pptTekst(s, f.hier ? 'WIJ ZITTEN HIER' : f.pct + '%', { x: x, y: y + 1.4, w: 1.7, h: 0.3, fontSize: 10, bold: true,
          color: f.hier ? PPT.wit : PPT.grijs, align: 'center', fontFace: 'Calibri' });
      });
      y += 2.2;
    }
    if (d.puntenKop && d.punten && d.punten.length) {
      pptTekst(s, d.puntenKop, { x: 0.6, y: y, w: 9.0, h: 0.4, fontSize: 15, bold: true, color: PPT.ink, fontFace: 'Calibri' });
      y += 0.45;
    }
    if (d.punten && d.punten.length) {
      pptTekst(s, d.punten.slice(0, 8).map(function (p) { return { text: p, options: { breakLine: true } }; }),
        { x: 0.8, y: y, w: 8.6, h: 2.2, fontSize: 15, color: PPT.ink, bullet: { code: d.soort === 'vinkjes' ? '2713' : '2022' }, fontFace: 'Calibri', lineSpacingMultiple: 1.3 });
      y += Math.min(d.punten.length, 8) * 0.32 + 0.2;
    } else if (d.punten && d.leeg) {
      pptTekst(s, d.leeg, { x: 0.6, y: y, w: 9.0, h: 0.5, fontSize: 15, color: PPT.grijs, italic: true, fontFace: 'Calibri' });
      y += 0.6;
    }
    if (d.soort === 'acties') {
      if (d.items.length) {
        var rijen = [[{ text: 'Actie', options: { bold: true } }, { text: 'Wie', options: { bold: true } },
                      { text: 'Wanneer', options: { bold: true } }, { text: 'Status', options: { bold: true } }]];
        d.items.forEach(function (a) { rijen.push([a.titel, a.eigenaar, a.deadline, a.status]); });
        s.addTable(rijen, { x: 0.6, y: y, w: 9.0, fontSize: 12, color: PPT.ink, fontFace: 'Calibri',
          border: { type: 'solid', color: 'E3DEDE', pt: 1 }, colW: [4.5, 1.7, 1.5, 1.3], rowH: 0.32 });
        y += 0.4 + d.items.length * 0.34;
      } else {
        pptTekst(s, 'Geen open acties.', { x: 0.6, y: y, w: 9.0, h: 0.4, fontSize: 15, color: PPT.grijs, fontFace: 'Calibri' });
        y += 0.5;
      }
    }
    if (d.soort === 'paren') {
      var kolom = Math.ceil(d.items.length / 2);
      d.items.forEach(function (p, i) {
        var kx = i < kolom ? 0.6 : 5.1;
        var ky = y + (i % kolom) * 0.52;
        pptTekst(s, p[0], { x: kx, y: ky, w: 4.3, h: 0.26, fontSize: 13, bold: true, color: PPT.ink, fontFace: 'Calibri' });
        pptTekst(s, p[1], { x: kx, y: ky + 0.24, w: 4.3, h: 0.26, fontSize: 11, color: PPT.grijs, fontFace: 'Calibri' });
      });
      y += kolom * 0.52 + 0.2;
    }
    if (d.kolommen) {
      d.kolommen.forEach(function (k, i) {
        var kx = 0.6 + i * 3.05;
        s.addShape(pptx.ShapeType.roundRect, { x: kx, y: y, w: 2.85, h: 2.4, fill: { color: PPT.licht }, rectRadius: 0.08 });
        pptTekst(s, k.kop, { x: kx + 0.15, y: y + 0.12, w: 2.55, h: 0.35, fontSize: 15, bold: true, color: PPT.navy, fontFace: 'Calibri' });
        pptTekst(s, k.items.map(function (t) { return { text: t, options: { breakLine: true } }; }),
          { x: kx + 0.15, y: y + 0.55, w: 2.55, h: 1.75, fontSize: 11, color: PPT.ink, bullet: true, fontFace: 'Calibri' });
      });
      y += 2.6;
    }
    if (d.kern) {
      pptTekst(s, d.kern, { x: 0.6, y: 4.55, w: 9.0, h: 0.6, fontSize: 14, bold: true, italic: true, color: PPT.tenne, fontFace: 'Calibri' });
    }
    pptTekst(s, stempel, { x: 0.6, y: 5.2, w: 6.5, h: 0.25, fontSize: 8, color: PPT.grijs, fontFace: 'Calibri' });
    pptTekst(s, 'Rottumeroog · ' + (idx + 1), { x: 7.4, y: 5.2, w: 2.2, h: 0.25, fontSize: 8, color: PPT.grijs, align: 'right', fontFace: 'Calibri' });
  });

  return pptx;
}

function maakPowerpoint(opt) {
  if (typeof PptxGenJS === 'undefined') {
    toast('De PowerPoint-module kon niet geladen worden. Gebruik de presentatiemodus.');
    return;
  }
  toast('PowerPoint wordt gemaakt…');
  var pptx;
  try { pptx = bouwPptx(opt); }
  catch (e) { toast('Het maken van de PowerPoint lukte niet.'); return; }

  pptx.write({ outputType: 'blob' }).then(function (blob) {
    var naam = 'Rottumeroog-teamstabilisatie-' + new Date().toISOString().slice(0, 10) + '.pptx';
    if (!window.claude || !window.claude.use) { toast('Downloaden kan hier niet. Gebruik de presentatiemodus.'); return; }
    return window.claude.use('downloads').then(function (dl) {
      if (!dl) { toast('Downloaden is hier niet beschikbaar. Gebruik de presentatiemodus.'); return; }
      return dl.save({ filename: naam, data: blob }).then(function () {
        log('PowerPoint gemaakt', 'Presentatie', naam);
        save(); toast('PowerPoint opgeslagen.');
      }).catch(function (err) {
        if (err && err.code === 'declined') toast('Opslaan geannuleerd.');
        else toast('Opslaan lukte niet: ' + ((err && err.message) || 'onbekende fout'));
      });
    });
  }).catch(function () { toast('Het maken van de PowerPoint lukte niet.'); });
}

   6. ACTIES / EVENTS
