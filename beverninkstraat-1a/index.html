<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Van Beverninkstraat 1A Teamstabilisatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  /* Ipse de Bruggen huisstijl */
  --tenne:      #CD2D00;
  --navy:       #017ACB;
  --sky:        #009BFF;
  --jordy:      #80BDE5;
  --atlantis:   #96CD3C;

  --paper:      #F2EFEF;
  --surface:    #FFFFFF;
  --surface-2:  #F8F6F6;
  --line:       #E3DEDE;
  --line-soft:  #EDE9E9;
  --ink:        #282727;
  --ink-soft:   #5A5555;
  --ink-faint:  #8A8383;

  --ok:         #4F7D14;
  --ok-bg:      #EDF5E0;
  --warn:       #A5720A;
  --warn-bg:    #FAF0DC;
  --risk:       #CD2D00;
  --risk-bg:    #FBE7E1;
  --busy:       #017ACB;
  --busy-bg:    #E3F1FB;
  --idle-bg:    #EFECEC;

  --ring:       0 0 0 3px rgba(1,122,203,.22);
  --shadow:     0 1px 2px rgba(40,39,39,.05), 0 10px 24px -18px rgba(40,39,39,.35);
  --regel-bg:   #282727;
  --regel-fg:   #F7F5F5;
  --regel-line: #282727;

  --display: "Inter", Arial, Helvetica, sans-serif;
  --sans:    "Inter", Arial, Helvetica, sans-serif;
  --mono:    "Inter", Arial, Helvetica, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #16191B;
    --surface:    #1D2124;
    --surface-2:  #23282B;
    --line:       #313739;
    --line-soft:  #282D30;
    --ink:        #E9EAEA;
    --ink-soft:   #A9B0B2;
    --ink-faint:  #838B8D;
    --navy:       #4FA9EC;
    --sky:        #64BCFF;
    --ok:         #A8D95A;
    --ok-bg:      #1E2A15;
    --warn:       #E3B558;
    --warn-bg:    #2C2415;
    --risk:       #FF7A52;
    --risk-bg:    #331711;
    --busy:       #4FA9EC;
    --busy-bg:    #12242F;
    --idle-bg:    #262B2E;
    --ring:       0 0 0 3px rgba(79,169,236,.3);
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 24px -18px rgba(0,0,0,.9);
    --regel-bg:   #23282B;
    --regel-fg:   #E9EAEA;
    --regel-line: #313739;
  }
}
:root[data-theme="dark"] {
    --regel-bg:   #23282B;
    --regel-fg:   #E9EAEA;
    --regel-line: #313739;
  --paper:      #16191B;
  --surface:    #1D2124;
  --surface-2:  #23282B;
  --line:       #313739;
  --line-soft:  #282D30;
  --ink:        #E9EAEA;
  --ink-soft:   #A9B0B2;
  --ink-faint:  #838B8D;
  --navy:       #4FA9EC;
  --sky:        #64BCFF;
  --ok:         #A8D95A;
  --ok-bg:      #1E2A15;
  --warn:       #E3B558;
  --warn-bg:    #2C2415;
  --risk:       #FF7A52;
  --risk-bg:    #331711;
  --busy:       #4FA9EC;
  --busy-bg:    #12242F;
  --idle-bg:    #262B2E;
  --ring:       0 0 0 3px rgba(79,169,236,.3);
  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 10px 24px -18px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1,h2,h3,h4 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -.011em; text-wrap: balance; }
p { margin: 0; max-width: 78ch; }
.uitleg { color: var(--ink-soft); font-size: 15px; max-width: 72ch; }
.uitleg + .uitleg { margin-top: 8px; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; }
input, select, textarea { font: inherit; color: inherit; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px); }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- topbar ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 11px; }
.brand .mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--tenne); flex: none;
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 15px;
}
.brand h1 { font-size: 17px; line-height: 1.1; }
.brand span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.zoek-top { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; width: 190px; }
.zoek-top:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring); width: 230px; }
@media (max-width: 560px) { .zoek-top { width: 100%; } .topbar-right { width: 100%; margin-left: 0; } }

.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; min-width: 0; flex: 1 1 100%; scrollbar-width: none; margin-top: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 9px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-faint); cursor: pointer;
  margin-bottom: -1px; white-space: nowrap; border-radius: 4px 4px 0 0;
}
.tabs button:hover { color: var(--ink); background: var(--surface-2); }
.tabs button.on { color: var(--navy); border-bottom-color: var(--navy); }
.tabs button:focus-visible { outline: none; box-shadow: var(--ring); }

/* ---------- knoppen ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-faint); color: var(--ink); }
.btn:focus-visible { outline: none; box-shadow: var(--ring); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 35%, transparent); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

/* ---------- kaarten ---------- */
main { padding: clamp(18px, 3vw, 30px) 0 90px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(14px, 2.4vw, 20px); box-shadow: var(--shadow); }
.card > * + * { margin-top: 12px; }
.card h3 { font-size: 17px; }
.card h4 { font-size: 14.5px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g6 { grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
.section-title h2 { font-size: 19px; }
.section-title .hint { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; }
main > .wrap > .section-title:first-child { margin-top: 0; }

/* ---------- statistiek ---------- */
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 14px; text-align: left; cursor: pointer; box-shadow: var(--shadow); display: block; width: 100%; }
.stat:hover { border-color: var(--navy); }
.stat:focus-visible { outline: none; box-shadow: var(--ring); }
.stat .n { font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 600; }
.stat .l { font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; }
.stat.risk .n { color: var(--risk); }
.stat.warn .n { color: var(--warn); }
.stat.ok .n   { color: var(--ok); }
.stat.busy .n { color: var(--busy); }

.bar { height: 7px; border-radius: 4px; background: var(--idle-bg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); border-radius: 4px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.idle { background: var(--idle-bg); color: var(--ink-soft); }
.pill.busy { background: var(--busy-bg); color: var(--busy); }
.pill.block{ background: var(--risk-bg); color: var(--risk); }
.pill.check{ background: var(--warn-bg); color: var(--warn); }
.pill.done { background: var(--ok-bg); color: var(--ok); }
.pill.high { background: var(--risk-bg); color: var(--risk); }
.pill.mid  { background: var(--warn-bg); color: var(--warn); }
.pill.low  { background: var(--idle-bg); color: var(--ink-faint); }
.pill.fase { background: var(--busy-bg); color: var(--busy); }
.pill.line { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }

/* ---------- cliëntwaarde ---------- */
.waarde { border: 1px solid color-mix(in srgb, var(--tenne) 30%, var(--line)); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.waarde .kop { background: var(--tenne); color: #fff; padding: 12px 18px; }
.waarde .kop h2 { font-size: 17px; color: #fff; }
.waarde .kop p { font-size: 13px; opacity: .92; margin-top: 2px; }
.waarde .body { padding: 16px 18px; display: grid; gap: 10px; }
.waarde .item { display: grid; grid-template-columns: 9px 1fr; gap: 12px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
.waarde .item:last-child { border-bottom: 0; padding-bottom: 0; }
.waarde .item::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tenne); margin-top: 8px; }
.waarde .item b { font-weight: 600; }
.waarde .item small { display: block; color: var(--ink-faint); font-family: var(--mono); font-size: 11px; margin-top: 3px; }

/* ---------- regel-blok ---------- */
.regel { border-radius: 12px; background: var(--regel-bg); color: var(--regel-fg); padding: 18px 20px; border: 1px solid var(--regel-line); }
.regel h3 { font-family: var(--display); font-size: 20px; letter-spacing: .01em; color: inherit; }
.regel p { color: inherit; opacity: .82; font-size: 14px; margin-top: 6px; }
.regel ol { counter-reset: r; margin-top: 14px; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.regel ol li { counter-increment: r; display: grid; grid-template-columns: 20px 1fr; gap: 9px; font-size: 13.5px; opacity: .92; }
.regel ol li::before { content: counter(r); font-family: var(--mono); font-size: 11px; opacity: .65; }

/* ---------- lijsten / tabellen ---------- */
.rows { display: grid; }
.row { display: grid; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.row:last-child { border-bottom: 0; }
.tabelwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-faint); font-weight: 400; text-align: left; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tr:last-child td { border-bottom: 0; }

/* ---------- checklist ---------- */
.check { display: grid; grid-template-columns: 18px 1fr; gap: 11px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border: 1.5px solid var(--ink-faint); border-radius: 4px; background: var(--surface); position: relative; top: 3px; cursor: pointer; flex: none; }
.check input:checked { background: var(--ok); border-color: var(--ok); }
.check input:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid #fff; border-width: 0 1.7px 1.7px 0; transform: rotate(43deg); }
:root[data-theme="dark"] .check input:checked::after { border-color: #16191B; }
.check input:focus-visible { outline: none; box-shadow: var(--ring); }
.check.done span { color: var(--ink-faint); text-decoration: line-through; }
.check span { font-size: 14.5px; }

/* ---------- actieboard ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 13px;
}
.filters select:focus, .filters input:focus { outline: none; box-shadow: var(--ring); border-color: var(--navy); }
.actie { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 9px; }
.actie.overdue { border-color: color-mix(in srgb, var(--risk) 45%, var(--line)); }
.actie .top { display: flex; gap: 10px; align-items: flex-start; }
.actie .titel { font-weight: 600; font-size: 15px; flex: 1; }
.actie .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.actie .cw { font-size: 13px; color: var(--ink-soft); background: var(--surface-2); border-left: 2px solid var(--tenne); padding: 7px 10px; border-radius: 0 6px 6px 0; }
.actie .cw b { color: var(--ink); font-weight: 600; }
.actie .cw.leeg { border-left-color: var(--warn); color: var(--warn); }
.actie .acties { display: flex; gap: 6px; flex-wrap: wrap; }
.actie .next { font-size: 13px; color: var(--ink-soft); }
.leeg-melding { text-align: center; padding: 40px 20px; color: var(--ink-faint); font-size: 14px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,20,20,.5); display: grid; place-items: center; padding: 16px; z-index: 100; }
.modal { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); width: min(620px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--surface); border-radius: 14px 14px 0 0; }
.modal header h3 { font-size: 17px; }
.modal .body { padding: 18px 20px; display: grid; gap: 14px; }
.modal footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
.veld { display: grid; gap: 5px; }
.veld label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-faint); }
.veld input, .veld select, .veld textarea {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; width: 100%;
}
.veld textarea { min-height: 66px; resize: vertical; font-family: var(--sans); }
.veld input:focus, .veld select:focus, .veld textarea:focus { outline: none; border-color: var(--navy); box-shadow: var(--ring); }
.veld .hint { font-size: 12px; color: var(--ink-faint); }
.veld-rij { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 200; box-shadow: var(--shadow); }

.routing { display: grid; gap: 8px; }
.routing .r { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.routing .r:last-child { border-bottom: 0; }
.routing .r b { font-weight: 500; font-size: 14.5px; }
.routing .r .naar { font-family: var(--mono); font-size: 12px; color: var(--navy); }

.persoon { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.persoon .av { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 14px; color: #fff; }
.persoon h4 { font-size: 15.5px; }
.persoon .rol { font-family: var(--mono); font-size: 11px; color: var(--navy); letter-spacing: .04em; }
.persoon ul { margin-top: 8px; display: grid; gap: 3px; }
.persoon ul li { font-size: 13.5px; color: var(--ink-soft); padding-left: 13px; position: relative; }
.persoon ul li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--jordy); }

.kijkwijzer { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.kijkwijzer div { border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; background: var(--surface-2); }
.kijkwijzer b { display: block; font-size: 13.5px; }
.kijkwijzer span { font-size: 13px; color: var(--ink-soft); }

.flow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 6px; }
.flow .s { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; font-size: 13px; }
.flow .a { color: var(--ink-faint); font-size: 13px; }

/* ---------- waar staan we nu ---------- */
.nu { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 12px; padding: clamp(16px, 2.6vw, 24px); box-shadow: var(--shadow); display: grid; gap: 16px; }
.nu-kop { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.nu-kop h2 { font-size: clamp(21px, 3.2vw, 27px); margin-top: 4px; }
.nu-kop .pill { margin-left: auto; }
.kernzin { font-size: 17px; font-weight: 600; color: var(--navy); max-width: 62ch; }
.meta-regel { font-size: 13.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.kolommen { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.kop-rij { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.kop-rij h4 { flex: 1; }
.nu h4, .fase-body h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }

.genummerd { counter-reset: g; display: grid; gap: 5px; }
.genummerd li { counter-increment: g; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; }
.genummerd li::before { content: counter(g) "."; color: var(--navy); font-weight: 600; }
.vinklijst { display: grid; gap: 5px; }
.vinklijst li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 15px; }
.vinklijst li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.stiplijst { display: grid; gap: 5px; }
.stiplijst li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 15px; }
.stiplijst li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--jordy); margin-top: 9px; }

/* ---------- fase-accordeon ---------- */
.fase-kaart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(15px, 2.4vw, 20px); box-shadow: var(--shadow); display: grid; gap: 12px; }
.fase-kaart.hier { border-color: var(--navy); border-width: 1.5px; }
.fase-kop { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.fase-nr { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; flex: none; }
.fase-kop .titelblok { flex: 1; min-width: 180px; }
.fase-kop h3 { font-size: 19px; }
.fase-kop .periode { font-size: 13px; color: var(--ink-faint); }
.fase-body { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 20px; }
.letten-lijst { display: grid; }
.letten-lijst > div { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.letten-lijst > div:last-child { border-bottom: 0; }
.letten-lijst b { display: block; font-size: 14.5px; }
.letten-lijst span { font-size: 14.5px; color: var(--ink-soft); }
.verwacht-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.verwacht-grid > div { background: var(--surface-2); border-radius: 10px; padding: 13px 15px; }
.verwacht-grid .wie { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.reflectie { background: var(--warn-bg); border-radius: 10px; padding: 14px 16px; }

/* ---------- logboek ---------- */

function load() {

  return seed();

/* Nieuwe onderdelen toevoegen aan een opgeslagen versie zonder bestaande gegevens te verliezen. */
function migreer(s) {
  var basis = seed();
  s.ui = s.ui || basis.ui;
  s.ui.filter = s.ui.filter || basis.ui.filter;
  if (TABS.indexOf(s.ui.tab) === -1) s.ui.tab = 'Overzicht';
  if (!s.focusPunten) s.focusPunten = basis.focusPunten;
  if (!s.weekPunten) s.weekPunten = basis.weekPunten;
  if (!s.afspraken) s.afspraken = basis.afspraken;
  if (!s.teamrollen) s.teamrollen = basis.teamrollen;
  if (!s.medewerkers) s.medewerkers = basis.medewerkers;
  if (!s.procedures) s.procedures = basis.procedures;
  if (!s.procedures.vmsStappen || !s.procedures.vmsStappen.length) s.procedures.vmsStappen = VMS_STAPPEN.slice();
  if (!s.defecten) s.defecten = [];
  if (!s.verbeterpunten) s.verbeterpunten = [];
  if (!s.log) s.log = [];
  if (!s.huisregels) s.huisregels = basis.huisregels;
  if (!s.dagprogramma) s.dagprogramma = basis.dagprogramma;
  if (!s.leerlijst) s.leerlijst = {};
  if (!s.fotos) s.fotos = [];
  if (s.ikBen == null) s.ikBen = '';
  /* Opgeslagen versies van vóór de opschoning kunnen nog cliëntgegevens bevatten. */
  delete s.clienten; delete s.vms; delete s.pb;
  s.acties.forEach(function (a) { delete a.client; });
  s.acties.forEach(function (a) {
    if (a.status === 'Controle nodig') a.status = 'Ter controle';
    if (a.controle == null) a.controle = a.prioriteit === 'hoog' ? 'Ja' : 'Nee';
    ['uitleg', 'backup', 'aangemaakt', 'voltooidDoor', 'voltooidOp', 'controleDoor', 'controleOp', 'afrondnotitie']
      .forEach(function (k) { if (a[k] == null) a[k] = ''; });
  });
  s.fases.forEach(function (f) { f.items.forEach(function (i) { if (i.wie == null) i.wie = ''; }); });
  return s;
}

var SYNC = {

var CODE_KEY = KEY + '-code';
var sync = { laatst: '', vorige: '', status: 'uit', timerSchrijf: 0, timerLees: 0 };

function syncMogelijk() { return !!(SYNC.url && SYNC.sleutel); }

function magWijzigen() {
  if (!syncMogelijk()) return true;   /* geen gedeelde opslag: gewoon lokaal werken */
  if (!SYNC.code) return true;
  try { return localStorage.getItem(CODE_KEY) === SYNC.code; } catch (e) { return false; }
}

function gedeeldDeel(s) {
  var o = {};
  GEDEELD.forEach(function (k) { o[k] = s[k]; });
  return o;
}

function syncVerzoek(pad, opties) {
  opties = opties || {};
  var kop = { apikey: SYNC.sleutel, Authorization: 'Bearer ' + SYNC.sleutel, 'Content-Type': 'application/json' };
  Object.keys(opties.headers || {}).forEach(function (k) { kop[k] = opties.headers[k]; });
  opties.headers = kop;
  return fetch(SYNC.url.replace(/\/+$/, '') + '/rest/v1/' + pad, opties);
}

function syncStatus(st) {
  sync.status = st;
  var el = document.getElementById('syncpil');
  if (!el) return;
  var tekst = '', soort = 'idle';
  if (st === 'live') {
    tekst = magWijzigen() ? 'Gedeeld · je kunt wijzigen' : 'Gedeeld · alleen lezen';
    soort = magWijzigen() ? 'done' : 'busy';
  } else if (st === 'offline') { tekst = 'Geen verbinding'; soort = 'block'; }
  el.className = 'pill ' + soort;
  el.textContent = tekst;
  el.style.display = tekst ? '' : 'none';
}

/* Het logboek is van iedereen samen: bij het overnemen voegen we de regels
   samen in plaats van ze te overschrijven. */
function mengLog(a, b) {
  var gezien = {}, uit = [];
  (a || []).concat(b || []).forEach(function (r) {
    if (!r) return;
    var sleutel = r.ts + '|' + r.wie + '|' + r.wat + '|' + (r.detail || '');
    if (gezien[sleutel]) return;
    gezien[sleutel] = 1; uit.push(r);
  });
  uit.sort(function (x, y) { return String(y.ts).localeCompare(String(x.ts)); });
  return uit.slice(0, 300);
}

function vensterOpen() {
  var h = document.getElementById('modalhost');
  return !!(h && h.innerHTML !== '');
}

function neemOver(binnen) {
  if (!binnen || vensterOpen()) return;
  var eigenLog = state.log || [];
  GEDEELD.forEach(function (k) { if (binnen[k] != null) state[k] = binnen[k]; });
  state.log = mengLog(eigenLog, binnen.log || []);
  state = migreer(state);
  sync.vorige = JSON.stringify(gedeeldDeel(state));
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* opslag vol of geblokkeerd */ }
  render();
}

function syncOphalen(daarna) {
  if (!syncMogelijk()) { syncStatus('uit'); if (daarna) daarna(); return; }
  syncVerzoek('dashboards?id=eq.' + encodeURIComponent(SYNC.rij) + '&select=state,updated_at')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rijen) {
      syncStatus('live');
      if (rijen && rijen.length) {
        sync.laatst = rijen[0].updated_at || '';
        neemOver(rijen[0].state);
      }
      if (daarna) daarna();
    })
    .catch(function () { syncStatus('offline'); if (daarna) daarna(); });
}

function syncSchrijven() {
  if (!syncMogelijk() || !magWijzigen()) return;
  var nu = JSON.stringify(gedeeldDeel(state));
  if (nu === sync.vorige) return;      /* alleen het scherm veranderde, niet de inhoud */
  sync.vorige = nu;
  clearTimeout(sync.timerSchrijf);
  sync.timerSchrijf = setTimeout(syncDuwen, 700);
}

function syncDuwen() {
  var rij = [{ id: SYNC.rij, state: gedeeldDeel(state), updated_at: new Date().toISOString(),
               updated_by: state.ikBen || 'onbekend' }];
  syncVerzoek('dashboards', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(rij)
  })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (uit) {
      if (uit && uit.length && uit[0].updated_at) sync.laatst = uit[0].updated_at;
      syncStatus('live');
    })
    .catch(function () { syncStatus('offline'); });
}

function syncVolgen() {
  if (!syncMogelijk()) return;
  clearInterval(sync.timerLees);
  sync.timerLees = setInterval(function () {
    if (document.hidden || vensterOpen()) return;
    syncVerzoek('dashboards?id=eq.' + encodeURIComponent(SYNC.rij) + '&select=state,updated_at')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rijen) {
        syncStatus('live');
        if (!rijen || !rijen.length) return;
        if (rijen[0].updated_at && rijen[0].updated_at !== sync.laatst) {
          sync.laatst = rijen[0].updated_at;
          neemOver(rijen[0].state);
        }
      })
      .catch(function () { syncStatus('offline'); });
  }, SYNC.tempo);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function vandaag() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }

/* Wijzigingsgeschiedenis: wie heeft wat wanneer veranderd.
   We bewaren de laatste 300 regels, zodat de opslag niet oneindig groeit. */
function log(wat, waar, detail) {
  state.log.unshift({
    id: uid('l'),
    ts: new Date().toISOString(),
    wie: state.ikBen || 'onbekend',
    wat: wat, waar: waar || '', detail: detail || ''
  });
  if (state.log.length > 300) state.log.length = 300;
}

function tijdNL(ts) {
  var d = new Date(ts);
  if (isNaN(d)) return '—';
  var vandaagStr = new Date().toDateString();
  var tijd = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if (d.toDateString() === vandaagStr) return 'vandaag ' + tijd;
  return datumNL(d.toISOString().slice(0, 10)) + ' · ' + tijd;
}
function isOverdue(a) {
  if (!a.deadline || a.status === 'Afgerond') return false;
  return new Date(a.deadline + 'T00:00:00') < vandaag();
}
function datumNL(s) {
  if (!s) return '—';
  var d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return esc(s);
  var m = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}
function statusClass(s) {
  return { 'Nog te doen': 'idle', 'Bezig': 'busy', 'Geblokkeerd': 'block', 'Ter controle': 'check', 'Afgerond': 'done' }[s] || 'idle';
}
function docClass(s) {
  return { 'Actueel': 'done', 'Behouden': 'done', 'Te controleren': 'check', 'Verplaatsen': 'busy',
           'Verouderd': 'block', 'Archiveren': 'idle', 'Duplicaat': 'idle', 'Verwijderen na controle': 'block' }[s] || 'idle';
}
function prioClass(p) { return { hoog: 'high', midden: 'mid', laag: 'low' }[p] || 'low'; }
function pct(done, total) { return total ? Math.round((done / total) * 100) : 0; }
function fasePct(n) {
  var f = state.fases.filter(function (x) { return x.n === n; })[0];
  if (!f) return 0;
  return pct(f.items.filter(function (i) { return i.done; }).length, f.items.length);
}
function totaalPct() {
  var d = 0, t = 0;
  state.fases.forEach(function (f) { f.items.forEach(function (i) { t++; if (i.done) d++; }); });
  return pct(d, t);
}
function kantPct(kant) {
  var rel = state.acties.filter(function (a) { return a.kant === kant; });
  if (!rel.length) return 0;
  return pct(rel.filter(function (a) { return a.status === 'Afgerond'; }).length, rel.length);
}
function toast(txt) {

    '<div><h4>Waarom werken we hier nu aan?</h4><p class="uitleg">' + esc(fase.waarom[0]) + '</p></div>' +
    '<div><div class="kop-rij"><h4>Onze focus op dit moment</h4>' +
    '<button class="btn sm ghost" data-act="focus-edit">Aanpassen</button></div>' +
    '<ol class="genummerd">' + state.focusPunten.slice(0, 5).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></div>' +
    '</div>' +

    '<div class="kolommen">' +
    '<div><h4>Deze fase is klaar wanneer</h4>' +
    '<ul class="vinklijst">' + fase.resultaten.slice(0, 6).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>' +
    '<div><div class="kop-rij"><h4>Wat verwachten we deze week?</h4>' +
    '<button class="btn sm ghost" data-act="week-edit">Aanpassen</button></div>' +
    '<ul class="stiplijst">' + state.weekPunten.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' +
    '</div>' +

    '<button class="btn primary" data-act="ga-route">Bekijk de hele fase</button>' +
    '</div>';

  h += '<div class="section-title"><h2>Actiestand</h2><span class="hint">eenmalige acties · klik door naar het actieboard</span></div>';
  h += '<div class="grid g6">' +
    stat('busy', open.length, 'Open acties', 'special', 'open') +
    stat('risk', blok.length, 'Blokkades', 'status', 'Geblokkeerd') +
    stat('risk', laat.length, 'Deadline verlopen', 'special', 'verlopen') +
    stat('warn', geen.length, 'Zonder eigenaar', 'special', 'geen-eigenaar') +
    stat('warn', state.acties.filter(function (a) { return a.status === 'Ter controle'; }).length, 'Ter controle', 'status', 'Ter controle') +
    stat('ok', klaar.length, 'Afgerond', 'status', 'Afgerond') +
    '</div>';

  h += '<div class="section-title"><h2>De vier pijlers van deze fase</h2>' +
    '<span class="hint">voortgang op basis van de acties in die categorie</span></div>';
  h += '<div class="grid g3">' + PIJLERS.map(pijlerKaart).join('') + '</div>';

  h += '<div class="section-title"><h2>Ik heb een vraag — waar moet ik zijn?</h2></div>';
  h += '<div class="card"><div class="routing">' +
    ROUTING.map(function (r) { return '<div class="r"><b>' + esc(r[0]) + '</b><span class="naar">→ ' + esc(r[1]) + '</span></div>'; }).join('') +
    '</div><p style="font-size:14px;color:var(--ink-soft);margin-top:12px">Twijfel je? Vraag het gewoon. Kleine vragen zijn ook welkom — die voorkomen meestal de grote.</p></div>';

  h += '<div class="section-title"><h2>Van de hoofdcoach</h2></div>';
  h += '<div class="card"><p style="font-size:15.5px;line-height:1.6">' + esc(MENSEN[0].boodschap) + '</p>' +
    '<div class="mono" style="font-size:12px;color:var(--ink-faint)">' + esc(MENSEN[0].naam) + ' · ' + esc(MENSEN[0].rol) + '</div></div>';

  h += logBlok();
  h += denkkaart('Iedereen heeft recht op een goed leven.');
  return h;
}

/* Wie heeft wat wanneer gewijzigd — voorkomt discussie over oude afspraken. */
function logBlok() {
  var uit = state.ui.logOpen;
  var regels = uit ? state.log.slice(0, 100) : state.log.slice(0, 8);

  var h = '<div class="section-title"><h2>Wat is er veranderd?</h2>' +
    '<span class="hint">' + state.log.length + ' wijziging' + (state.log.length === 1 ? '' : 'en') + ' bewaard</span></div>';

  h += '<div class="card">';
  if (!state.ikBen) {
    h += '<div class="waarschuwing" style="margin-top:0">Je naam staat nog niet ingesteld, dus wijzigingen komen op “onbekend” te staan. ' +
      'Klik rechtsboven op <strong>Ik ben…</strong> en kies je naam.</div>';
  }
  if (!state.log.length) {
    h += '<p class="uitleg">Nog geen wijzigingen vastgelegd. Zodra iemand een actie afrondt, een afspraak aanpast of een verbeterpunt meldt, staat het hier.</p>';
  } else {
    h += '<div class="logboek">' + regels.map(function (r) {
      return '<div class="logregel">' +
        '<div class="log-tijd">' + esc(tijdNL(r.ts)) + '</div>' +
        '<div><b>' + esc(r.wat) + '</b>' + (r.waar ? ' <span class="pill line">' + esc(r.waar) + '</span>' : '') +
        (r.detail ? '<div class="wie">' + esc(r.detail) + '</div>' : '') + '</div>' +
        '<div class="log-wie">' + esc(r.wie) + '</div>' +
        '</div>';
    }).join('') + '</div>';
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
      (state.log.length > 8 ? '<button class="btn sm" data-act="log-toggle">' +
        (uit ? 'Toon alleen de laatste 8' : 'Toon alles (' + Math.min(state.log.length, 100) + ')') + '</button>' : '') +
      '<button class="btn sm ghost danger" data-act="log-wis">Geschiedenis wissen</button></div>';
  }
  h += '</div>';
  return h;
}

function stat(kind, n, label, mode, val) {
  return '<button class="stat ' + kind + '" data-act="filter" data-mode="' + mode + '" data-val="' + esc(val) + '">' +
    '<div class="n mono">' + n + '</div><div class="l">' + esc(label) + '</div></button>';
}

/* De vier pijlers van fase 1: basiszorg, rollen, cliëntafspraken en teamstructuur.
   De status komt uit de acties in die categorie — zo staat er nooit een percentage
   dat niemand kan terugvinden. */
var PIJLER_UITLEG = {
  'Basiszorg': 'Krijgt iedere cliënt iedere dag wat er volgens zijn plan nodig is?',
  'Rollen': 'Heeft iedere terugkerende taak een eigenaar én een back-up?',
  'Cliëntafspraken': 'Zijn plan, signaleringsplan en medische afspraken actueel en vindbaar?',
  'Teamstructuur': 'Staan de overleggen, de lijnen en de inwerkroute?'
};

function catPct(cat) {
  var rel = state.acties.filter(function (a) { return a.categorie === cat; });
  return pct(rel.filter(function (a) { return a.status === 'Afgerond'; }).length, rel.length);
}

function pijlerKaart(cat) {
  var rel = state.acties.filter(function (a) { return a.categorie === cat; });
  var openN = rel.filter(function (a) { return a.status !== 'Afgerond'; }).length;
  var p = catPct(cat);
  var label = !rel.length ? 'nog geen acties' : (p === 100 ? 'op orde' : (p > 0 ? 'in opbouw' : 'nog niet gestart'));
  return '<div class="card"><span class="eyebrow">Pijler</span>' +
    '<h3>' + esc(cat) + '</h3>' +
    '<div class="mono" style="font-size:11.5px;color:var(--ink-faint)">' + esc(label) + '</div>' +
    '<p class="uitleg" style="font-size:13.5px">' + esc(PIJLER_UITLEG[cat] || '') + '</p>' +
    '<div class="bar"><i style="width:' + p + '%"></i></div>' +
    '<div class="mono" style="font-size:12px;color:var(--ink-faint)">' + p + '% acties afgerond · ' + openN + ' open</div>' +
    '<button class="btn sm" data-act="filter" data-mode="categorie" data-val="' + esc(cat) + '">Bekijk acties</button></div>';
}

/* ---------- Roadmap ---------- */
var FASE_KLEUR = { 1: 'var(--navy)', 2: 'var(--sky)', 3: 'var(--ok)', 4: 'var(--warn)', 5: 'var(--tenne)' };

function viewRoute() {
  var h = '<div class="section-title"><h2>Onze route naar een stabiel Van Beverninkstraat 1A</h2></div>';

  h += '<div class="card">' +
    '<p class="uitleg">We bouwen Van Beverninkstraat 1A stap voor stap op. We proberen niet alles tegelijk op te lossen. ' +
    'Eerst moet de basis iedere dag kloppen. Daarna werken we aan eenduidig begeleiden, daarna aan vakmanschap en eigenaarschap, ' +
    'en uiteindelijk aan borgen: goed werken moet blijven bestaan, ook als er mensen wisselen.</p>' +
    '<p class="uitleg"><strong>De maanden zijn een richtlijn.</strong> We gaan niet automatisch naar een volgende fase omdat de tijd voorbij is. ' +
    'We gaan verder wanneer de belangrijkste doelen van de huidige fase voldoende staan.</p>' +
    '<p class="uitleg">Let op het verschil: een <strong>vinkje</strong> betekent dat iets geregeld is. ' +
    '<strong>Geborgd</strong> betekent dat het ook blijft werken als jij er niet bent. Dat tweede is waar we naartoe werken.</p>' +
    '</div>';

  h += '<div class="grid" style="margin-top:14px">' + FASES.map(function (f) {
    var st = state.fases.filter(function (x) { return x.n === f.n; })[0];
    var done = st.items.filter(function (i) { return i.done; }).length;
    var p = pct(done, st.items.length);
    var huidig = state.fase === f.n;
    var open_ = state.acties.filter(function (a) { return a.fase === f.n && a.status !== 'Afgerond'; });
    var controle = state.acties.filter(function (a) { return a.fase === f.n && a.status === 'Ter controle'; });
    var uit = state.ui.openFase === f.n;

    var kop = '<div class="fase-kop">' +
      '<div class="fase-nr" style="background:' + FASE_KLEUR[f.n] + '">' + f.n + '</div>' +
      '<div class="titelblok"><h3>' + esc(f.naam) + '</h3>' +
      '<div class="periode">' + esc(f.periode) + '</div></div>' +
      (huidig ? '<span class="pill busy">Wij zitten hier</span>'
              : '<button class="btn sm" data-act="set-fase" data-n="' + f.n + '">Zet als huidige fase</button>') +
      '</div>';

    var samenvatting = '<p class="kernzin" style="font-size:16px">“' + esc(f.kernzin) + '”</p>' +
      '<p class="uitleg"><strong>Doel:</strong> ' + esc(f.doel) + '</p>' +
      '<div class="bar' + (p === 100 ? ' ok' : '') + '"><i style="width:' + p + '%"></i></div>' +
      '<div class="meta-regel">' + done + ' van ' + st.items.length + ' punten · ' + p + '% · ' +
      open_.length + ' open acties · ' + controle.length + ' ter controle</div>' +
      '<div><button class="btn' + (uit ? '' : ' primary') + '" data-act="fase-toggle" data-n="' + f.n + '">' +
      (uit ? 'Inklappen' : 'Bekijk deze fase') + '</button></div>';

    if (!uit) return '<div class="fase-kaart' + (huidig ? ' hier' : '') + '">' + kop + samenvatting + '</div>';

    var body = '<div class="fase-body">' +

      '<div><h4>Waarom werken we hier nu aan?</h4>' +
      f.waarom.map(function (w) { return '<p class="uitleg">' + esc(w) + '</p>'; }).join('') + '</div>' +

      '<div><h4>Wat betekent dit voor mij tijdens mijn dienst?</h4>' +
      '<ul class="stiplijst">' + f.voorMij.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') + '</ul></div>' +

      (f.trekkers ? '<div><h4>Wie trekt deze fase?</h4><div class="chips">' +
        f.trekkers.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
        '</div><p class="uitleg" style="margin-top:8px">Iedere medewerker helpt mee. Zie je iets dat beter kan, geef het aan.</p>' +
        '<button class="btn sm primary" data-act="verbeter-nieuw" style="margin-top:8px">+ Ik zie iets dat beter kan</button></div>' : '') +

      (f.extraBlokken ? f.extraBlokken.map(function (blok) {
        return '<div><h4>' + esc(blok.kop) + '</h4>' +
          (blok.tekst ? '<p class="uitleg">' + esc(blok.tekst) + '</p>' : '') +
          (blok.lijst ? '<ul class="stiplijst" style="margin-top:8px">' + blok.lijst.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
          (blok.paren ? '<div class="letten-lijst" style="margin-top:8px">' + blok.paren.map(function (p) {
            return '<div><b>' + esc(p[0]) + '</b><span>' + esc(p[1]) + '</span></div>'; }).join('') + '</div>' : '') +
          (blok.slot ? '<p class="uitleg" style="margin-top:8px"><strong>' + esc(blok.slot) + '</strong></p>' : '') +
          (blok.waarschuwing ? '<div class="waarschuwing">' + esc(blok.waarschuwing) + '</div>' : '') +
          '</div>';
      }).join('') : '') +

      '<div><h4>Waar letten we op?</h4><div class="letten-lijst">' +
      f.letten.map(function (l) { return '<div><b>' + esc(l[0]) + '</b><span>' + esc(l[1]) + '</span></div>'; }).join('') +
      '</div></div>' +

      '<div><h4>Wat verwachten we van elkaar?</h4><div class="verwacht-grid">' +
      '<div><div class="wie">Van jou als begeleider</div><ul class="stiplijst">' +
      f.verwacht.medewerker.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
      '<div><div class="wie">Van de PB’er</div><ul class="stiplijst">' +
      f.verwacht.pb.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
      '<div><div class="wie">Van E, coach en hoofdcoach</div><ul class="stiplijst">' +
      f.verwacht.coach.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
      '</div>' +
      '<p class="uitleg" style="margin-top:10px">Dit zijn <strong>verwachtingen</strong>: houding en gedrag die bij je rol horen. ' +
      'Geen afvinklijst — je hoort er elke dienst naar te handelen.</p></div>' +

      '<div><div class="kop-rij"><h4>Checklist van deze fase</h4>' +
      '<button class="btn sm" data-act="check-nieuw" data-n="' + f.n + '">+ Punt toevoegen</button></div>' +
      st.items.map(function (i) {
        return '<div class="afspraak"><div>' +
          '<label class="check' + (i.done ? ' done' : '') + '" style="border:0;padding:0">' +
          '<input type="checkbox" data-act="fase-item" data-id="' + i.id + '"' + (i.done ? ' checked' : '') + '>' +
          '<span>' + esc(i.t) + '</span></label>' +
          '<div class="wie" style="padding-left:29px">' + (i.wie ? 'Toegewezen aan ' + esc(i.wie) : 'Nog niemand toegewezen') + '</div></div>' +
          '<div class="knoppen"><button class="btn sm ghost" data-act="check-edit" data-id="' + i.id + '">Bewerk</button>' +
          '<button class="btn sm ghost danger" data-act="check-weg" data-id="' + i.id + '">×</button></div></div>';
      }).join('') + '</div>' +

      '<div><div class="kop-rij"><h4>Openstaande acties in deze fase</h4>' +
      '<button class="btn sm" data-act="filter" data-mode="fase" data-val="' + f.n + '">Open in het actieboard</button></div>' +
      (open_.length
        ? '<ul class="stiplijst">' + open_.slice(0, 8).map(function (a) {
            return '<li>' + esc(a.titel) + ' — <span style="color:var(--ink-faint)">' + esc(a.eigenaar || 'zonder eigenaar') + '</span></li>';
          }).join('') + '</ul>' + (open_.length > 8 ? '<p class="uitleg">en nog ' + (open_.length - 8) + ' andere.</p>' : '')
        : '<p class="uitleg">Geen openstaande acties in deze fase.</p>') + '</div>' +

      '<div><h4>Hoe weten we dat het echt gebeurt?</h4>' +
      '<ul class="stiplijst">' + f.bewijs.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>' +

      '<div><h4>Concrete resultaten</h4>' +
      '<ul class="vinklijst">' + f.resultaten.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>' +

      '<div class="reflectie"><div class="l">Reflectievraag</div><p>' + esc(f.reflectie) + '</p></div>' +

      '<div style="background:var(--surface-2);border-radius:10px;padding:14px 16px">' +
      '<h4>Wanneer gaan we door naar de volgende fase?</h4>' +
      '<p class="uitleg">' + esc(f.door) + '</p></div>' +

      '</div>';

    return '<div class="fase-kaart' + (huidig ? ' hier' : '') + '">' + kop + samenvatting + body + '</div>';
  }).join('') + '</div>';

  h += denkkaart('We doen niet voor iedereen hetzelfde, maar kijken wat bij jou past.');
  return h;
}

function denkkaart(tekst) {
  return '<div class="denkkaart" style="margin-top:22px"><div class="q">“</div>' +
    '<div><p>' + esc(tekst) + '</p><small>Ipse de Bruggen</small></div></div>';
}

/* ---------- Acties ---------- */

function filterActies() {
  var f = state.ui.filter;
  return state.acties.filter(function (a) {
    if (f.special === 'open' && a.status === 'Afgerond') return false;
    if (f.special === 'verlopen' && !isOverdue(a)) return false;
    if (f.special === 'geen-eigenaar' && (a.eigenaar || a.status === 'Afgerond')) return false;
    if (f.eigenaar && a.eigenaar !== f.eigenaar) return false;
    if (f.status && a.status !== f.status) return false;
    if (f.prioriteit && a.prioriteit !== f.prioriteit) return false;
    if (f.fase && String(a.fase) !== String(f.fase)) return false;
    if (f.kant && a.kant !== f.kant) return false;
    if (f.categorie && a.categorie !== f.categorie) return false;
    if (f.q) {
      var q = f.q.toLowerCase();
      var hay = (a.titel + ' ' + a.eigenaar + ' ' + a.betrokken + ' ' + a.notitie + ' ' + a.clientwaarde).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    var af = a.status === 'Afgerond' ? 1 : 0, bf = b.status === 'Afgerond' ? 1 : 0;
    if (af !== bf) return af - bf;
    var ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    var ap = PRIOS.indexOf(a.prioriteit), bp = PRIOS.indexOf(b.prioriteit);
    if (ap !== bp) return ap - bp;
    return (a.deadline || '9999').localeCompare(b.deadline || '9999');
  });
}

function sel(name, opts, cur, leeg) {
  return '<select data-filter="' + name + '"><option value="">' + esc(leeg) + '</option>' +
    opts.map(function (o) { return '<option value="' + esc(o) + '"' + (String(cur) === String(o) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
    '</select>';
}

function viewActies() {
  var f = state.ui.filter;
  var lijst = filterActies();
  var h = '<div class="section-title"><h2>Actieboard</h2>' +
    '<span class="hint">' + lijst.length + ' van ' + state.acties.length + ' acties</span></div>';

  h += '<div class="card"><div class="filters">' +
    '<input type="search" data-filter="q" placeholder="Zoeken…" value="' + esc(f.q || '') + '" style="min-width:150px">' +
    sel('eigenaar', NAMEN, f.eigenaar, 'Alle eigenaren') +
    sel('status', STATUSSEN, f.status, 'Alle statussen') +
    sel('prioriteit', PRIOS, f.prioriteit, 'Alle prioriteiten') +
    sel('fase', [1, 2, 3, 4, 5], f.fase, 'Alle fases') +
    sel('kant', KANTEN, f.kant, 'Waar hoort dit bij?') +
    sel('categorie', CATEGORIEEN, f.categorie, 'Alle categorieën') +
    (f.special ? '<span class="pill check">' + ({ verlopen: 'alleen verlopen', 'geen-eigenaar': 'alleen zonder eigenaar', open: 'alleen open acties' }[f.special] || '') + '</span>' : '') +
    '<button class="btn sm" data-act="filter-wis">Wis filters</button>' +
    '<button class="btn primary sm" data-act="actie-nieuw" style="margin-left:auto">+ Nieuwe actie</button>' +
    '</div></div>';

  h += '<div class="grid g2" style="margin-top:14px">';
  if (!lijst.length) h += '<div class="leeg-melding">Geen acties die aan dit filter voldoen.</div>';
  h += lijst.map(function (a) {
    var over = isOverdue(a);
    return '<div class="actie' + (over ? ' overdue' : '') + '">' +
      '<div class="top"><span class="titel">' + esc(a.titel) + '</span>' +
      '<span class="pill ' + prioClass(a.prioriteit) + '">' + esc(a.prioriteit) + '</span></div>' +
      '<div class="meta">' +
      '<span class="pill ' + statusClass(a.status) + '">' + esc(a.status) + '</span>' +
      '<span class="pill fase">fase ' + a.fase + '</span>' +
      '<span class="pill line">' + esc(a.categorie) + '</span>' +
      '<span class="pill line">' + esc(a.kant) + '</span>' +
      '</div>' +
      '<div class="meta mono" style="font-size:11.5px;color:var(--ink-faint)">' +
      '<span>' + (a.eigenaar ? esc(a.eigenaar) : '⚠ zonder eigenaar') + '</span>' +
      (a.betrokken ? '<span>· met ' + esc(a.betrokken) + '</span>' : '') +
      '<span>· ' + (over ? '⚠ ' : '') + datumNL(a.deadline) + '</span>' +
      '</div>' +
      '<div class="cw' + (a.clientwaarde ? '' : ' leeg') + '">' +
      (a.clientwaarde ? '<b>Beter voor de cliënt:</b> ' + esc(a.clientwaarde) : 'Nog niet ingevuld: wat wordt hierdoor beter voor de cliënt?') +
      '</div>' +
      (a.uitleg ? '<div class="next">' + esc(a.uitleg) + '</div>' : '') +
      (a.notitie ? '<div class="next"><b>Volgende stap:</b> ' + esc(a.notitie) + '</div>' : '') +
      (a.voltooidDoor ? '<div class="next" style="color:var(--ink-faint)">Uitgevoerd door ' + esc(a.voltooidDoor) + ' op ' + datumNL(a.voltooidOp) +
        (a.controleDoor ? ' · gecontroleerd door ' + esc(a.controleDoor) + ' op ' + datumNL(a.controleOp) : '') +
        (a.afrondnotitie ? ' — ' + esc(a.afrondnotitie) : '') + '</div>' : '') +
      '<div class="acties">' +
      (a.status === 'Afgerond'
        ? '<button class="btn sm" data-act="actie-heropen" data-id="' + a.id + '">Heropenen</button>'
        : a.status === 'Ter controle'
          ? '<button class="btn sm primary" data-act="actie-goedgekeurd" data-id="' + a.id + '">✓ Gecontroleerd</button>'
          : a.controle === 'Ja'

function protocolKnop(wat) {

function viewBasiszorg() {
  var open = state.ui.openBasiszorg || '';
  var h = '<div class="section-title"><h2>Basiszorg in beeld</h2>' +
    '<span class="hint">snel naslaan tijdens je dienst</span></div>';

  h += fotoBlok('Basiszorg', '');

    'Kort, met beeld, zodat je ze even kunt pakken zonder een systeem te openen.</p>' +
    '<p class="uitleg" style="margin-top:10px">De teksten hieronder zijn voor deze woning uitgeschreven op basis van ' +
    'algemeen vakmanschap. Ze zijn geen kopie van een protocol en vervangen er ook geen. Laat ze nakijken door iemand ' +
    'die bekwaam is, en pas ze aan als jullie het anders doen.</p>' +
    '<div class="waarschuwing">Een kaart hier is een geheugensteun. Hij vervangt niet het cliëntplan, ' +

    'Verschillen ze? Dan is de officiële actuele bron leidend.</div></div>';

  h += '<div class="grid g3" style="margin-top:14px">' + BASISZORG.map(function (b) {
    return '<button class="hoofdstukkaart' + (open === b.id ? ' aan' : '') + (b.klaar ? '' : ' leeg') + '" ' +
      'data-act="basiszorg" data-id="' + b.id + '">' + ico(b.icoon) +
      '<b>' + esc(b.titel) + '</b><span class="bz-kern">' + esc(b.kern) + '</span></button>';
  }).join('') + '</div>';

  var tonen = state.ui.print ? BASISZORG.filter(function (b) { return b.klaar; })
                             : BASISZORG.filter(function (b) { return b.id === open; });
  h += tonen.map(basiszorgKaart).join('');
  if (!state.ui.print && !tonen.length) {
    h += '<div class="leeg-melding">Kies hierboven een onderwerp.</div>';
  }
  return h;
}

function basiszorgKaart(b) {
  if (!b.klaar) {
    return '<div class="card" style="margin-top:16px"><h3>' + esc(b.titel) + '</h3>' +
      '<p class="uitleg">Deze kaart is nog niet uitgewerkt. Tot die tijd: kijk in Mijn Vilans Protocollen ' +
      'en vraag het na bij een ervaren collega.</p>' + protocolKnop(b.titel) + '</div>';
  }
  if (b.id === 'ontlasting') return kaartOntlasting();
  if (b.id === 'mondzorg') return kaartMondzorg();
  if (b.id === 'kamer') return kaartKamer();
  if (b.id === 'adl') return kaartADL();
  return zorgkaart(b);
}

/* Eén opmaak voor alle uitgeschreven zorghandelingen. */
function zorgkaart(b) {
  var z = ZORGKAARTEN[b.id];
  if (!z) {
    return '<div class="card" style="margin-top:16px"><h3>' + esc(b.titel) + '</h3>' +
      '<p class="uitleg">Deze kaart is nog niet uitgewerkt.</p>' + protocolKnop(b.titel) + '</div>';
  }
  function blok(kop, icoonNaam, punten, soort) {
    if (!punten || !punten.length) return '';
    var lijst = soort === 'chips'
      ? '<div class="chips" style="margin-top:8px">' + punten.map(function (t) {
          return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>'
      : soort === 'genummerd'
        ? '<ol class="genummerd" style="margin-top:6px">' + punten.map(function (t) {
            return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>'
        : '<ul class="' + (soort || 'stiplijst') + '" style="margin-top:6px">' + punten.map(function (t) {
            return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    return '<div class="format-blok"><div class="format-blok-kop">' + ico(icoonNaam) +
      '<h4>' + esc(kop) + '</h4></div>' + lijst + '</div>';
  }

  return '<div class="format" id="bz-' + b.id + '"><div class="format-kop">' + ico(b.icoon) +
    '<div><h2>' + esc(b.titel) + '</h2><p>' + esc(z.doel) + '</p></div></div>' +
    '<div class="format-body">' +
    blok('Voorbereiden', 'vink', z.voor, 'vinklijst') +
    (b.id === 'handen' ? '<div class="format-blok"><div class="format-blok-kop">' + ico('vink') +
      '<h4>De zes plekken die je vaak vergeet</h4></div><div class="handrij">' +
      HANDSTAPPEN.map(function (hs, i) {
        return '<div class="handstap"><svg viewBox="0 0 48 48" aria-hidden="true">' + hs[1] + '</svg>' +
          '<b>' + esc(hs[0]) + '</b><i>' + (i + 1) + '</i></div>';
      }).join('') + '</div></div>' : '') +
    blok('Zo doe je het', 'pijl', z.stappen, 'genummerd') +
    blok('Waar let je op?', 'let', z.letop, 'chips') +
    (z.wanneer ? blok('Wanneer?', 'klok', z.wanneer, 'chips') : '') +
    blok('Waardigheid en privacy', 'hart', z.waardigheid, 'stiplijst') +
    blok('Na afloop', 'kompas', z.na, 'stiplijst') +
    (z.schakel ? '<div class="format-blok"><div class="format-blok-kop">' + ico('telefoon') +
      '<h4>Wie schakel je in?</h4></div><div class="wie-blok" style="margin-top:8px">' +
      z.schakel.map(function (w) {
        return '<div class="wie-rij"><span>' + esc(w[0]) + '</span><b>→ ' + esc(w[1]) + '</b></div>';
      }).join('') + '</div></div>' : '') +
    '<div class="waarschuwing">Wat er voor déze bewoner is afgesproken staat in het officiële dossier en gaat altijd voor. ' +
    'Voer alleen uit wat je mag en kunt.</div>' +
    fotoBlok('Basiszorg', b.id) +
    protocolKnop(z.protocol) +
    '</div></div>';
}

];

function standaardOpties() {

}

}

function viewPresentatie() {
  var dias = presentatieDias(state.ui.presOpties || standaardOpties());
  var i = Math.max(0, Math.min(state.ui.dia || 0, dias.length - 1));
  var d = dias[i];

  var body = '';
  if (d.soort === 'titel') {
    body = '<div class="dia-titel"><h1>' + esc(d.titel) + '</h1><h2>' + esc(d.sub) + '</h2>' +
      '<p class="dia-kern">' + esc(d.kern) + '</p><div class="dia-voet">' + esc(d.voet) + '</div></div>';
  } else {
    body = '<h1>' + esc(d.titel) + '</h1>';
    if (d.chips) body += '<div class="dia-chips">' + d.chips.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>';
    if (d.tekst) body += '<p class="dia-tekst">' + esc(d.tekst) + '</p>';
    if (d.groot) body += '<div class="dia-groot">' + esc(d.groot) + '</div>';
    if (d.stats) body += '<div class="dia-stats">' + d.stats.map(function (s) {
      return '<div><b>' + esc(s.n) + '</b><span>' + esc(s.l) + '</span></div>'; }).join('') + '</div>';
    if (d.soort === 'fases') body += '<div class="dia-fases">' + d.items.map(function (f) {
      return '<div class="' + (f.hier ? 'hier' : '') + '"><span class="nr">' + f.n + '</span>' +
        '<b>' + esc(f.naam) + '</b><span>' + esc(f.periode) + '</span>' +
        (f.hier ? '<span class="hier-label">Wij zitten hier</span>' : '<span class="pctje">' + f.pct + '%</span>') + '</div>';
    }).join('') + '</div>';
    if (d.punten && d.punten.length) body += '<ul class="dia-lijst' + (d.soort === 'vinkjes' ? ' vink' : '') + '">' +
      d.punten.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
    if (d.punten && !d.punten.length && d.leeg) body += '<p class="dia-tekst">' + esc(d.leeg) + '</p>';
    if (d.puntenKop && d.punten && d.punten.length) body = body.replace('<ul class="dia-lijst', '<h3>' + esc(d.puntenKop) + '</h3><ul class="dia-lijst');
    if (d.soort === 'acties') body += '<div class="dia-acties">' + (d.items.length ? d.items.map(function (a) {
      return '<div><b>' + esc(a.titel) + '</b><span>' + esc(a.eigenaar) + ' · ' + esc(a.deadline) + ' · ' + esc(a.status) + '</span></div>';
    }).join('') : '<p class="dia-tekst">Geen open acties.</p>') + '</div>';
    if (d.soort === 'paren') body += '<div class="dia-paren">' + d.items.map(function (p) {
      return '<div><b>' + esc(p[0]) + '</b><span>' + esc(p[1]) + '</span></div>'; }).join('') + '</div>';
    if (d.kolommen) body += '<div class="dia-kolommen">' + d.kolommen.map(function (k) {
      return '<div><h3>' + esc(k.kop) + '</h3><ul>' + k.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div>';
    if (d.kern) body += '<p class="dia-kern">' + esc(d.kern) + '</p>';
  }

  return '<div class="dia">' + body + '</div>' +
    '<div class="dia-nav">' +
    '<button class="btn" data-act="dia-vorige"' + (i === 0 ? ' disabled' : '') + '>← Vorige</button>' +
    '<span class="dia-teller">' + (i + 1) + ' / ' + dias.length + '</span>' +
    '<button class="btn primary" data-act="dia-volgende"' + (i === dias.length - 1 ? ' disabled' : '') + '>Volgende →</button>' +
    '<button class="btn" data-act="dia-scherm">Volledig scherm</button>' +
    '<button class="btn" data-act="dia-pptx">PowerPoint maken</button>' +
    '<button class="btn ghost" data-act="presenteer-stop">Afsluiten</button>' +
    '</div>';
}

/* ---------- Zoeken over het hele dashboard ---------- */
function zoekIndex() {

  begeleidenBlokken().forEach(function (b) { add('Begeleiden', b.titel, b.woorden, { begeleidenQ: b.titel.split(' ')[0] }); });
  DOELGROEP.kaarten.forEach(function (k) { add('Doelgroep', k[0], k[1], null); });
  add('Doelgroep', 'Onze doelgroep', 'doelgroep verstandelijke beperking psychiatrie psychose achterdocht angst ontregeling ' + DOELGROEP.kern, null);
  ACHTERDOCHT.signalen.forEach(function (t) { add('Begeleiden', 'Signaal van achterdocht: ' + t, 'achterdocht wantrouwen signaal', { begeleidenQ: 'achterdocht' }); });
  SITUATIES.forEach(function (s) { add('Begeleiden', 'Wat doe ik als: ' + s.titel, s.woorden + ' ' + s.stappen.join(' '), { situatie: s.id }); });
  BASISHOUDING.forEach(function (b) { add('Begeleiden', 'Basishouding: ' + b[0], b[1], null); });
  LACCS.forEach(function (l) { add('Begeleiden', 'LACCS: ' + l[0], l[1].join(' '), { begeleidenQ: 'laccs' }); });
  SPANNING.forEach(function (s) { add('Begeleiden', 'Spanning ' + s.k + ' — ' + s.t, s.beeld + ' ' + s.doen.join(' '), { begeleidenQ: 'spanning' }); });

  MVG_WERELD.forEach(function (w) { add('Doelgroep', w[0], w[1] + ' ' + w[2].join(' '), null); });
  state.huisregels.forEach(function (g) { add('Huisregels', g.kop, g.punten.join(' '), null); });
  state.dagprogramma.forEach(function (d) { add('Dagprogramma', d.kop, d.punten.join(' '), null); });
  WERKWIJZEN.forEach(function (w) { add('Werkwijzen', w.titel, w.woorden + ' ' + w.stappen.join(' '), null); });
  SYSTEMEN.forEach(function (y) { add('Werkwijzen', 'Systeem: ' + y[0], y[1], null); });
  FORMATS.forEach(function (x) { add('Documenten', 'Format: ' + x.titel, x.doel, { openFormat: x.id }); });
  INWERKDAGEN.forEach(function (d) { add('Inwerken', d[0], d[1].join(' '), null); });
  INWERKDELEN.forEach(function (d) { add('Inwerken', d[0], d[2].join(' '), null); });
  LEERLIJST.forEach(function (l) { add('Inwerken', 'Leren: ' + l, 'vilans protocol oefenen meekijken feedback', null); });
  BASISZORG.forEach(function (b) {
    var z = ZORGKAARTEN[b.id];
    var tekst = b.kern + (z ? ' ' + z.doel + ' ' + (z.stappen || []).join(' ') + ' ' + (z.letop || []).join(' ') : '');
    add('Basiszorg', b.titel, tekst, { openBasiszorg: b.id });

  ONTLASTING_VORMEN.forEach(function (v) { add('Basiszorg', 'Ontlasting ' + v[0] + ' — ' + v[1], v[2], { openBasiszorg: 'ontlasting' }); });
  MONDZORG.letop.forEach(function (t) { add('Basiszorg', 'Mondzorg: let op ' + t, 'mondzorg tanden poetsen gebit', { openBasiszorg: 'mondzorg' }); });
  WIE_NODIG.forEach(function (w) { add('Wie heb ik nodig?', w[0], w[1] + ' ' + w[2].join(' '), null); });
  ROLKAARTEN.forEach(function (r) { add('Wie heb ik nodig?', r.naam, r.kop + ' ' + r.waarvoor + ' ' + r.lijst.join(' '), null); });
  PARAMEDISCH.forEach(function (p) {
    add('Wie heb ik nodig?', p.naam, p.kern + ' ' + p.waarvoor.join(' ') + ' ' + p.wanneer.join(' '), { openDiscipline: p.id });

  add('Wie heb ik nodig?', 'Medische dienst bellen', 'medisch bellen telefoon nummer 088 967 1660 twijfel koorts pijn wond val ' + MEDISCH_WAARVOOR.join(' '), null);

  state.onboarding.forEach(function (c) {
    c.items.forEach(function (i) { add('Inwerken', c.cat + ': ' + i.t, '', null); });
  });
  return ix;
}

function viewZoek() {
  var q = state.ui.zoek.toLowerCase().trim();
  /* Korte zoekwoorden (AR, VMS, PAT) alleen als heel woord — anders matcht "AR" ook in "waar" en "naar". */
  var kort = q.length <= 3;
  var re = null;
  if (kort) {
    try { re = new RegExp('(^|[^a-z0-9])' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)', 'i'); }
    catch (e) { re = null; }
  }
  var res = zoekIndex().filter(function (r) {
    var hooi = r.titel + ' ' + r.tekst + ' ' + r.tab;
    return re ? re.test(hooi) : hooi.toLowerCase().indexOf(q) !== -1;
  });

  var perTab = {};
  res.forEach(function (r) { (perTab[r.tab] = perTab[r.tab] || []).push(r); });

  var h = '<div class="section-title"><h2>Waar vind ik “' + esc(state.ui.zoek) + '”?</h2>' +
    '<span class="hint">' + res.length + ' resultaat' + (res.length === 1 ? '' : 'en') + '</span></div>';

  if (!res.length) {
    h += '<div class="card"><p class="uitleg">Niets gevonden. Probeer een ander woord — bijvoorbeeld <em>slaan</em>, <em>epilepsie</em>, ' +
      '<em>voorraad</em>, <em>inwerken</em>, <em>medicatie</em> of de naam van een cliënt.</p>' +
      '<button class="btn" data-act="zoek-top-wis">Terug naar het dashboard</button></div>';
    return h;
  }

  h += '<div class="card"><button class="btn sm" data-act="zoek-top-wis">Zoeken sluiten</button></div>';
  h += '<div class="grid" style="margin-top:14px">' + Object.keys(perTab).map(function (tab) {
    return '<div class="card"><div class="kop-rij"><h3>' + esc(tab) + '</h3>' +
      '<span class="pill line">' + perTab[tab].length + '</span></div>' +
      perTab[tab].slice(0, 12).map(function (r) {
        return '<div class="afspraak"><div><div class="tekst">' + esc(r.titel) + '</div>' +
          (r.tekst ? '<div class="wie">' + esc(r.tekst.slice(0, 150)) + (r.tekst.length > 150 ? '…' : '') + '</div>' : '') + '</div>' +
          '<button class="btn sm" data-act="zoek-ga" data-tab="' + esc(tab) + '" ' +
          'data-extra="' + esc(JSON.stringify(r.extra || {})) + '">Open</button></div>';
      }).join('') +
      (perTab[tab].length > 12 ? '<p class="uitleg">en nog ' + (perTab[tab].length - 12) + ' resultaten op deze pagina.</p>' : '') +
      '</div>';
  }).join('') + '</div>';
  return h;
}

function tourWis() {
  var oud = document.querySelector('.tour-doel');
  if (oud) oud.classList.remove('tour-doel');
}

/* Het vinkje "niet meer tonen" bewaren we meteen, ook als iemand halverwege stopt. */
function tourOnthouden() {
  var v = document.querySelector('[data-tourniet]');
  var aan = !!(v && v.checked);
  try {
    if (aan) localStorage.setItem(TOUR_KEY, 'gezien');
    else localStorage.removeItem(TOUR_KEY);
  } catch (e) { /* opslag geblokkeerd */ }
  return aan;
}

function tourStop(onthouden) {
  if (onthouden) { try { localStorage.setItem(TOUR_KEY, 'gezien'); } catch (e) { /* opslag geblokkeerd */ } }
  state.ui.tour = null;
  tourWis();
  sluitModal();
}

function tourToon() {
  var i = state.ui.tour || 0;
  var st = RONDLEIDING[i];
  if (!st) { tourStop(true); return; }

  tourWis();
  if (st.doel) {
    var el = document.querySelector(st.doel);
    if (el) { el.classList.add('tour-doel'); }
  }

  var host = document.getElementById('modalhost');
  host.innerHTML = '<div class="overlay" data-act="tour-achtergrond"><div class="modal tour" role="dialog" aria-modal="true">' +
    '<div class="body">' +
    '<span class="stap">Stap ' + (i + 1) + ' van ' + RONDLEIDING.length + '</span>' +
    '<h3>' + esc(st.titel) + '</h3>' +
    '<p>' + esc(st.tekst) + '</p>' +
    '</div>' +
    '<label class="tour-niet"><input type="checkbox" data-tourniet' +
    (localStorage.getItem(TOUR_KEY) === 'gezien' ? ' checked' : '') + '> Deze rondleiding niet meer tonen</label>' +
    '<footer>' +
    '<div class="bolletjes">' + RONDLEIDING.map(function (x, n) {
      return '<i class="' + (n === i ? 'aan' : '') + '"></i>';
    }).join('') + '</div>' +
    (i > 0 ? '<button class="btn" data-act="tour-vorige">Vorige</button>' : '') +
    '<button class="btn" data-act="tour-sluit">Sluiten</button>' +
    '<button class="btn primary" data-act="tour-volgende">' + (i === RONDLEIDING.length - 1 ? 'Klaar' : 'Volgende') + '</button>' +
    '</footer></div></div>';
}

function tourStart() {
  state.ui.tour = 0;
  tourToon();
}

function tourMisschien() {
  if (state.ui.print || state.ui.presenteer) return;
  try { if (localStorage.getItem(TOUR_KEY) === 'gezien') return; } catch (e) { return; }
  tourStart();
}

function regelsNaarLijst(s) {
  return String(s || '').split('\n').map(function (r) { return r.trim(); }).filter(Boolean);

function openModal(titel, velden, obj, onSave) {
  var host = document.getElementById('modalhost');
  var body = '';
  var i = 0;
  while (i < velden.length) {
    var v = velden[i];
    if (v.vol) { body += veldHtml(v, obj); i++; continue; }
    var v2 = velden[i + 1];
    if (v2 && !v2.vol) { body += '<div class="veld-rij">' + veldHtml(v, obj) + veldHtml(v2, obj) + '</div>'; i += 2; }
    else { body += veldHtml(v, obj); i++; }
  }
  host.innerHTML = '<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">' +
    '<header><h3>' + esc(titel) + '</h3><button class="btn sm ghost" data-act="modal-sluit" style="margin-left:auto">Sluiten</button></header>' +
    '<div class="body">' + body + '</div>' +
    '<footer><button class="btn" data-act="modal-sluit">Annuleren</button>' +
    '<button class="btn primary" data-act="modal-opslaan">Opslaan</button></footer></div></div>';

  host._save = function () {
    var data = {};
    velden.forEach(function (v) {
      var el = host.querySelector('[name="' + v.k + '"]');
      if (el) data[v.k] = el.value.trim();
    });
    if (!velden[0].optioneel && !data[velden[0].k]) { toast('Vul in elk geval een ' + velden[0].l.toLowerCase() + ' in.'); return; }
    onSave(data);
    sluitModal();
  };
  var first = host.querySelector('input, select, textarea');
  if (first) first.focus();
}

function veldHtml(v, obj) {
  var val = obj && obj[v.k] != null ? obj[v.k] : '';
  var inner;
  if (v.t === 'select') {
    inner = '<select id="veld-' + v.k + '" name="' + v.k + '">' + v.opts.map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(val) === String(o) ? ' selected' : '') + '>' + (o === '' ? '— geen —' : esc(o)) + '</option>';
    }).join('') + '</select>';
  } else if (v.t === 'textarea') {
    inner = '<textarea id="veld-' + v.k + '" name="' + v.k + '">' + esc(val) + '</textarea>';
  } else {
    inner = '<input id="veld-' + v.k + '" type="' + v.t + '" name="' + v.k + '" value="' + esc(val) + '">';
  }
  return '<div class="veld"><label for="veld-' + v.k + '">' + esc(v.l) + '</label>' + inner +
    (v.hint ? '<div class="hint">' + esc(v.hint) + '</div>' : '') + '</div>';
}

function sluitModal() { document.getElementById('modalhost').innerHTML = ''; }

function maakPowerpoint(opt) {
  if (typeof PptxGenJS === 'undefined') {
    toast('De PowerPoint-module kon niet geladen worden. Gebruik de presentatiemodus.');
    return;
  }
  toast('PowerPoint wordt gemaakt…');
  var pptx;
  try { pptx = bouwPptx(opt); }
  catch (e) { toast('Het maken van de PowerPoint lukte niet.'); return; }

  pptx.write({ outputType: 'blob' }).then(function (blob) {
    var naam = 'VanBeverninkstraat1A-teamstabilisatie-' + new Date().toISOString().slice(0, 10) + '.pptx';
    /* Als artifact loopt het opslaan via de downloadcapability; als los HTML-bestand
       in een gewone browser via een blob-link. */
    if (!window.claude || !window.claude.use) return bewaarLokaal(blob, naam);
    return window.claude.use('downloads').then(function (dl) {
      if (!dl) { toast('Downloaden is hier niet beschikbaar. Gebruik de presentatiemodus.'); return; }
      return dl.save({ filename: naam, data: blob }).then(function () {
        log('PowerPoint gemaakt', 'Presentatie', naam);
        save(); toast('PowerPoint opgeslagen.');
      }).catch(function (err) {
        if (err && err.code === 'declined') toast('Opslaan geannuleerd.');
        else toast('Opslaan lukte niet: ' + ((err && err.message) || 'onbekende fout'));
      });
    });
  }).catch(function () { toast('Het maken van de PowerPoint lukte niet.'); });
}

function bewaarLokaal(blob, naam) {
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = naam;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    log('PowerPoint gemaakt', 'Presentatie', naam);
    save(); toast('PowerPoint opgeslagen.');
  } catch (e) {
    toast('Downloaden kan hier niet. Gebruik de presentatiemodus.');
  }
}

document.addEventListener('change', function (e) {
  var t = e.target;

  if (!magWijzigen() &&
      t.matches('[data-act="fase-item"], [data-act="onb-item"], [data-leer], [data-pb], [data-mwnotitie], [data-mw]')) {
    if (t.type === 'checkbox') t.checked = !t.checked;   /* zet het vinkje terug */
    vraagCode(); return;
  }
  if (t.matches('[data-act="fase-item"]')) {
    var id = t.getAttribute('data-id');
    state.fases.forEach(function (f) {
      f.items.forEach(function (i) {
        if (i.id === id) {
          i.done = t.checked;
          log(t.checked ? 'Checklistpunt afgevinkt' : 'Vinkje weggehaald', 'Route — fase ' + f.n, i.t);
        }
      });
    });
    save(); render(); return;
  }
  if (t.matches('[data-leer]')) {
    var hnd = t.getAttribute('data-leer'), stp = t.getAttribute('data-stap');
    if (!state.leerlijst[hnd]) state.leerlijst[hnd] = {};
    if (t.checked) state.leerlijst[hnd][stp] = true; else delete state.leerlijst[hnd][stp];
    log('Inwerkpunt bijgewerkt', 'Inwerken', hnd + ' — ' + stp + (t.checked ? ': gedaan' : ': teruggezet'));
    save(); return;
  }
  if (t.matches('[data-act="onb-item"]')) {
    var oid = t.getAttribute('data-id');
    state.onboarding.forEach(function (c) { c.items.forEach(function (i) { if (i.id === oid) i.done = t.checked; }); });
    save(); render(); return;
  }
  if (t.matches('[data-pres]')) {
    state.ui.presOpties = state.ui.presOpties || standaardOpties();
    state.ui.presOpties[t.getAttribute('data-pres')] = t.checked;
    save(); return;
  }
  if (t.matches('[data-mwnotitie]')) {
    var mwn = state.medewerkers.filter(function (x) { return x.id === t.getAttribute('data-mwnotitie'); })[0];
    if (mwn) { mwn.notitie = t.value; save(); }
    return;
  }
  if (t.matches('[data-mw]')) {
    var mws = state.medewerkers.filter(function (x) { return x.id === t.getAttribute('data-mw'); })[0];
    if (mws) {
      var vk = t.getAttribute('data-v');
      var naamVanVaardigheid = vk;
      VAARDIGHEDEN.forEach(function (cat) {
        cat[2].forEach(function (v) { if (v[0] === vk) naamVanVaardigheid = v[1]; });
      });
      var statusNaam = '';
      BEKWAAM_STATUS.forEach(function (bs) { if (bs[0] === t.value) statusNaam = bs[1]; });
      if (t.value) mws.scores[vk] = t.value; else delete mws.scores[vk];
      log('Bekwaamheid bijgewerkt', 'Bekwaamheid', mws.naam + ' — ' + naamVanVaardigheid + ': ' + (statusNaam || 'niet bepaald'));
      save(); render();
    }
    return;
  }
  if (t.matches('[data-filter]')) {
    var f = t.getAttribute('data-filter');
    state.ui.filter[f] = t.value;
    state.ui.filter.special = '';
    save(); render();
    var el = document.querySelector('[data-filter="' + f + '"]');
    if (el && f !== 'q') el.focus();
  }
});

document.addEventListener('input', function (e) {
  if (e.target.matches('[data-zoek="werk"]')) {
    state.ui.werkQ = e.target.value;
    save();
    var pw = e.target.selectionStart;
    render();
    var zw = document.querySelector('[data-zoek="werk"]');
    if (zw) { zw.focus(); try { zw.setSelectionRange(pw, pw); } catch (err) { /* geen selectie mogelijk */ } }
    return;
  }
  if (e.target.matches('[data-zoek="begeleiden"]')) {
    state.ui.begeleidenQ = e.target.value;
    save();
    var p = e.target.selectionStart;
    render();
    var z = document.querySelector('[data-zoek="begeleiden"]');
    if (z) { z.focus(); try { z.setSelectionRange(p, p); } catch (err) { /* search-veld ondersteunt geen selectie */ } }
    return;
  }
  if (e.target.matches('[data-filter="q"]')) {
    state.ui.filter.q = e.target.value;
    state.ui.filter.special = '';
    save();
    var pos = e.target.selectionStart;
    render();
    var el = document.querySelector('[data-filter="q"]');
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* type ondersteunt geen selectie */ } }
  }
});
